  S.inbox=[];S.files=[];ui.lastTr=0;saveInbox();renderAll();return toast("Разбор пуст. Выписки можно загрузить заново");}
 if((x=c("[data-reset]"))){if(!x.dataset.armed){x.dataset.armed="1";x.textContent="Точно убрать всё из выписок?";x.classList.add("danger");return;}
  const yms=S.tx.filter(q=>q.s==="file").map(q=>q.d.slice(0,7));S.tx=S.tx.filter(q=>q.s!=="file"&&q.s!=="demo");S.inbox=[];S.files=[];ui.lastTr=0;ui.month=null;ui.quarter=null;
  saveMonths(yms);clearTimeout(inboxT);write("meta/inbox",{rows:[]});renderAll();return toast("Убрано всё, что пришло из выписок");}
 if((x=c("[data-untr]"))){r=S.tx.find(q=>q.id===x.dataset.untr);if(!r)return;const legs=[r].concat(r.pair?S.tx.filter(q=>q.pair===r.pair&&q!==r):[]);
  legs.forEach(q=>{const row={id:q.id,d:q.d,b:q.b,ac:q.ac||"",dir:q.o&&q.o.a<0?-1:1,a:Math.abs(q.a),o:Object.assign({a:q.a,cur:"GBP",t:""},q.o,{p:""}),c:"",l:"",v:0,auto:false,touched:true,twin:null,key:q.key,s:q.s,at:q.at||0};
   const k=seenKey(row);S.ownSeen=S.ownSeen.filter(z=>z!==k);S.inbox.push(row);});
  S.tx=S.tx.filter(q=>!legs.includes(q));saveSettings();saveMonths(legs.map(q=>q.d.slice(0,7)));saveInbox();ui.trOpen=true;renderAll();return toast("Вернул в разбор: "+legs.length);}
 if(c("[data-ownadd]")){const v=norm($("#ownIn").value);if(v.length<3)return toast("Нужно хотя бы три символа");if(!S.own.includes(v))S.own.push(v);saveSettings();
  S.inbox.forEach(q=>{if(!q.touched&&!q.maybe)classify(q);});const n=settle();saveInbox();renderAll();return toast(n?`Убрано из разбора переводов: ${n}`:"Добавлено");}
 if(c("[data-imp]"))return $("#impIn").click();
 if(c("[data-impno]")){ui.imp=null;return renderSettings();}
 if(c("[data-impyes]")){if(!ui.imp)return;const rev=S.rev,ms=new Set(S.tx.map(q=>q.d.slice(0,7)));applyState(ui.imp);S.rev=rev;ui.imp=null;ui.period=null;ui.quarter=null;
  S.tx.forEach(q=>ms.add(q.d.slice(0,7)));settle();saveMonths([...ms]);saveRules();saveSettings();saveInbox();renderAll();return toast(`Данные заменены: строк ${S.tx.length}`);}
 if((x=c("[data-owndel]"))){S.own.splice(+x.dataset.owndel,1);saveSettings();return renderSettings();}
 if((x=c("[data-holderdel]"))){delete S.holders[x.dataset.holderdel];saveSettings();return renderSettings();}
 if((x=c("[data-rule]"))){S.rules.splice(+x.dataset.rule,1);saveRules();return renderSettings();}
 if(c("[data-esave]")){r=S.tx.find(q=>q.id===ui.edit);if(!r)return;const was=r.d.slice(0,7),cat=$("#e-c").value;
  if(!cat||!$("#e-d").value)return toast("Нужны дата и блок");
  r.d=$("#e-d").value;r.a=round2(+$("#e-a").value||0);r.c=cat;r.l=$("#e-l").value.trim();r.b=$("#e-b").value;r.v=cat==="rev"?round2(+$("#e-v").value||0):0;
  ui.edit=null;saveMonths([was,r.d.slice(0,7)]);renderAll();return toast("Строка сохранена");}
 if((x=c("[data-edel]"))){if(!x.dataset.armed){x.dataset.armed="1";x.textContent="Точно удалить?";x.classList.add("danger");return;}
  r=S.tx.find(q=>q.id===ui.edit);if(r){S.tx=S.tx.filter(q=>q!==r);ui.edit=null;saveMonths([r.d.slice(0,7)]);renderAll();toast("Строка удалена");}return;}
 if(c("[data-eclose]")){ui.edit=null;return renderLedger();}
 if((x=c("[data-row]"))){ui.edit=x.dataset.row;renderLedger();const s=$("#e-l");if(s)s.scrollIntoView({block:"center",behavior:"smooth"});return;}
});
document.addEventListener("keydown",ev=>{
 const t=ev.target;if(ev.key!=="Enter"||!t.matches)return;
 if(t.matches("[data-row],[data-repgo],[data-reprow],[data-focus]"))return t.click();
 if(t.matches("#view-inbox input.lab,#view-inbox input.vat")){const r=inboxRow(t);if(r&&r.c){if(t.dataset.f==="v"){r.v=round2(+t.value||0);r.vSet=true;}else{r.l=t.value.trim();r.auto=false;r.touched=true;if(!r.vSet)r.v=vatOf(r);}accept([r.id]);}}
 if(t.id==="ownIn"){const b=document.querySelector("[data-ownadd]");if(b)b.click();}
});
document.addEventListener("input",ev=>{const t=ev.target;
 if(t.id==="ruleQ"){ui.ruleQ=t.value;$("#ruleBody").innerHTML=ruleRows();}
 if(t.id==="rep-q"){rp.q=t.value;saveRep();paintSums();renderRepOut();}});
document.addEventListener("change",ev=>{
 const t=ev.target;
 if(t.id==="impIn"){const f=t.files[0];t.value="";if(!f)return;f.text().then(txt=>{let x=null;try{x=JSON.parse(txt);}catch(e){}
   if(!x||!Array.isArray(x.tx))return toast("Это не файл данных Money: в нём нет строк");ui.imp=x;renderSettings();});return;}
 if(t.id==="fileIn"){const f=[...t.files];t.value="";if(f.length)handleFiles(f);return;}
 if(t.id==="rep-preset"){if(t.value){Object.assign(rp,preset(t.value));saveRep();renderReports();}return;}
 if(t.dataset.rep&&t.dataset.rep!=="q"){rp[t.dataset.rep]=t.value;saveRep();return renderReports();}
 if(t.id==="periodSel"){ui.period=t.value;return renderDash();}
 if(t.id==="personSel"){ui.focus=t.value?"p:"+t.value:"";return renderDash();}
 if(t.id==="qSel"){ui.quarter=t.value;ui.edit=null;return renderLedger();}
 if(t.dataset.fx){const v=+t.value;if(v>0){S.fx[t.dataset.fx]=v;S.inbox.forEach(r=>{if(r.o.cur===t.dataset.fx)r.a=round2(Math.abs(toGBP(r.o.a,r.o.cur)));});saveSettings();saveInbox();renderInbox();toast("Курс сохранён");}return;}
 if(t.dataset.fbank||t.dataset.fcur){const f=S.files.find(q=>q.id===(t.dataset.fbank||t.dataset.fcur));if(!f)return;
  if(t.dataset.fbank)f.bank=t.value;else f.cur=t.value;
  S.inbox.forEach(r=>{if(r.f!==f.id)return;r.b=f.bank;if(!r.o.fix){r.o.cur=f.cur;r.a=round2(Math.abs(toGBP(r.o.a,f.cur)));}if(!r.touched)classify(r);r.twin=findTwin(r);});
  saveInbox();renderInbox();return;}
 if(t.dataset.f&&t.closest("#view-inbox")){const r=inboxRow(t);if(!r)return;
  // A name typed for a receipt brings that client's VAT with it — unless the sum was typed by hand.
  if(t.dataset.f==="l"){r.l=t.value.trim();r.auto=false;r.touched=true;if(!r.vSet&&r.c==="rev"){const v=vatOf(r);if(v!==(+r.v||0)){r.v=v;const e=document.getElementById("v-"+r.id);if(e)e.value=v||"";}}saveInbox();}
  else if(t.dataset.f==="v"){r.v=round2(+t.value||0);r.vSet=true;saveInbox();}}
});
// Files can be dropped anywhere on the page, not only on the box that says so.
let dragN=0;const veil=()=>$("#dropveil"),hasFiles=ev=>ev.dataTransfer&&[...(ev.dataTransfer.types||[])].includes("Files");
window.addEventListener("dragenter",ev=>{if(!hasFiles(ev))return;ev.preventDefault();dragN++;veil().hidden=false;});
window.addEventListener("dragover",ev=>{if(hasFiles(ev))ev.preventDefault();});
window.addEventListener("dragleave",ev=>{if(!hasFiles(ev))return;dragN=Math.max(0,dragN-1);if(!dragN)veil().hidden=true;});
window.addEventListener("drop",ev=>{if(!hasFiles(ev))return;ev.preventDefault();dragN=0;veil().hidden=true;const f=[...ev.dataTransfer.files];if(f.length)handleFiles(f);});
let rsT=null;window.addEventListener("resize",()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(ui.tab==="today")Today.resize();if(ui.tab==="dashboard")renderDash();if(ui.tab==="reports")renderRepOut();if(ui.tab==="cash")Cash.resize();},200);});
window.__tx={parsePdfLines,parseGrid,parseCSV,feed(p,name){const rec={id:uid(),name,bank:p.bank,cur:p.defCur,acc:p.acc||"",total:p.rows.length,from:"",to:"",pdf:!!p.pdf,check:p.check};const fresh=(p.ownAccs||[]).filter(n=>!S.own.includes(n));if(fresh.length)S.own.push(...fresh);Object.assign(rec,ingest(p,rec,"file"));S.files.unshift(rec);ui.lastTr=settle();renderAll();return rec;}};
window.__cash=Cash.test;
const h=(location.hash||"").slice(1);
if(h==="cash-days"){Cash.view("days");setTab("cash");}else if(TABS.includes(h)&&h!=="today")setTab(h);
load();
})();
</script>
