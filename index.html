// =====================================================================================================================
// LIVE — the forecast engine (begin)
//
// One pure function, Live.compute(ledger document, plan document, T, opts) → model. «Сегодня» and «Касса»
// draw what it returns and work nothing out themselves, so two tabs cannot disagree about a figure. It reads its four
// arguments, the page's constants (FOUNDERS, CURS, GENERIC, FX0) and two pure helpers (norm, owner). It never looks at
// S, the DOM, storage or the clock: "today" is the argument T, the rates are the ledger document's own. Days are
// counted from a date's digits in UTC. So the same two documents and T give the same JSON in any browser and any
// time zone, and nothing it is handed is changed.
//
// ENTRY POINTS
//  Live.compute(ledger, plan, T, opts) → model     the engine
//  Live.upgrade(plan) → plan                        a v1 plan document as v2; a v2 one unchanged. Pure: a copy comes back
//  Live.today() → "YYYY-MM-DD"                      the date in London, read from the clock on every call
//  Live.day(ms) → "YYYY-MM-DD"                      the date in London of a stored moment (a row's c0, a balance's at)
//  Live.passed(model, accountKey, asOf) → [{id, tick, on}]   the list for «Что из этого уже прошло?» (see below)
//  window.__money = {compute, upgrade, passed, model(opts), today}   the same, for the checks; model() is compute on
//                                                   what the page holds now, today is a getter
//
// ARGUMENTS
//  ledger  what GET /api/founder/money stores: {tx, inbox, rules, fx, aliases, history}. Rows with s:"demo" are left
//          out of everything. r.at is when a row was uploaded (ms; read as 0 when absent): a statement row closes a
//          typed line only if it was uploaded AFTER the line was typed, and only statements uploaded after a hand
//          mark can say the bank shows no such payment. Until the uploader writes `at` on the rows it brings,
//          nothing typed is closed by a statement. A row in a currency the page has no rate for is read as pounds.
//  plan    what GET /api/founder/money/cash stores, v2. A v1 document is upgraded on the way in (Live.upgrade).
//  T       today, "YYYY-MM-DD".
//  opts    {H}: the horizon in days, 30 or 60 (default 60). The window W is T … T+H, both ends included.
//
// THE PLAN DOCUMENT, v2 (every v1 field is kept; `fx`, `horizon` and banks[].on are no longer read)
//  cushion                         number, default 5000
//  banks[]                         {id, name, bank, cur, amt} + asOf:"YYYY-MM-DD", at:ms, by — the day and moment the
//                                  balance was typed; legacy:true — a v1 balance, which is no anchor, only a figure
//                                  to offer when the founder types the real one
//  inflows|team|taxes|other[]      {id, name, amt, cur, bank, date, on, fixed, tag, info} +
//    c0:ms          created (0 for rows that came from v1)          m:{t:ms,by}   last human edit
//    blk            rev|cogs|fixed|other|behalf|tax|mika|misha|vanya; by list when absent (rev, cogs, tax, other)
//    sk, skBy       link to a ledger series, stored only when a founder chose it ("hand") or the row is a
//                   materialised forecast; otherwise the link is found again on every compute (LINKS)
//    cyc, src       on a materialised forecast row: its cycle "YYYY-MM" and src:"hist"; its id is "h|"+sk+"|"+cyc
//    sure           false = a forecast row a founder moved or switched off without confirming the amount: it stays
//                   history (kind "hist"). Anything else is typed.
//    extra          «это сверх обычного»: adds on top of its series' forecast instead of being taken out of it
//    vat            cash = amt × 1.2                inv   a typed inflow the cautious line does not delay
//    offAt:ms       set when the row is switched off in v2: it then still holds its place in the forecast
//    mon:"YYYY-MM"  the month an undated row belongs to (the month of T when absent)
//    paid           {on:"YYYY-MM-DD", at:ms, by, ok?, legacy?, made?} — a hand mark. `true` (an old tab) reads as
//                   legacy. made: the press that marked the line also wrote this row down (see below)
//    tx[], notx[]   ledger row ids a founder said are / are not this row's payment        closed  «это всё»
//  ser{[sk]}                       {off, seen:"YYYY-MM", made, blk, name, amt, cur, day, bank, by, at}
//  tails{rev|cogs|small|behalf|mika|misha|vanya}  {on} — whether that block's average is forecast (default on)
//  vat{on}                         whether VAT is computed from revenue (default on)
//  cautious{on}                    whether the screens show the cautious scenario (default off). The engine works the
//                                  cautious line out either way and decides nothing by this switch: it only hands it
//                                  on, as model.cautious, to whoever draws
//
// WHAT A TAP WRITES INTO THE PLAN (the engine reads these and nothing else; it never writes)
//  a balance typed                 on the banks row: amt, asOf, at: now, by; legacy removed
//  a row added                     id: uid(), c0: now, m, blk, sure:true; mon when it has no date
//  «Оплачено» / «Получено»         paid:{on: Live.today(), at: now, by}; taken off — paid removed; «Всё верно» — paid.ok.
//                                  On a line the page had only forecast — history, VAT by the rule, a month of a «каждый
//                                  месяц» row — the same press writes the line down first (the next entry) and the mark
//                                  remembers that it did, paid.made: taking such a mark off deletes the row, and the
//                                  forecast stands as it stood before the press. The engine does not read `made`
//  the on/off tick                 on:false with offAt: now (so the row keeps its place in the forecast); on again —
//                                  offAt removed
//  a forecast moved, ticked or     a row in the item's list: id: item.id, sk: item.sk, cyc: item.cyc, src:"hist",
//  switched off                    name, bank, cur:"GBP", date, amt: item.occ.E, sure:false (+ date / paid / on:false)
//  «Сумма верная»                  the same row with sure:true and amt: item.amt. «Вернуть по истории» deletes it
//  the VAT item edited             a taxes row of any id with sk: item.sk ("tax|vat|2026Q3")
//  «каждый месяц»                  plan.ser[sk] = {made:true, amt, cur, day, bank, blk, name, by, at: now}, where sk is
//                                  the row's item.sk or, if it has none, "m|"+norm(name)
//  «Больше не ждём» / «Понятно»    plan.ser[sk].off = true / plan.ser[sk].seen = the card row's ym
//  «Это оно» / «Нет, это новый»    tx:[hint.id] / notx:[hint.id] on the row
//
// THE MODEL (money is GBP rounded to pence unless a field says "native"; dates are "YYYY-MM-DD", months "YYYY-MM")
//  T, H, end                       today, the horizon, T+H
//  cushion, fx                     the plan's cushion; the rates used (£1 = fx[cur])
//  cautious                        plan.cautious.on: whether to show the cautious scenario. Every *_C figure, days[].c
//                                  and verdict.id are the same with it on or off; a screen that is told `false` draws
//                                  the expected line alone and reads v1 and v2 as one sentence
//  sheetEnd, L, reach              latest date of a sheet row ("" if none); of any filed or recognised row; of any
//                                  row at all, never past T — the months before the month of `reach` are whole
//  v0                              true while an active account has no balance: `now` is null and both lines start at 0
//  accounts[]                      one per plan.banks row, plus one for any (bank, currency) that a statement row or an
//                                  open typed row names and the plan does not hold yet (inPlan:false)
//    key                           "Wise|GBP" (a second row of the same bank and currency: "Wise|GBP|<row id>")
//    id, bank, cur, name, title    plan row id (null if not in the plan); name is "Wise GBP", title the row's own name
//    inPlan, active, material      active: its bank has a ledger row in the last 60 days or an open typed row names
//                                  it. material: active and worth ≥ 10% of now, or has an open item within 14 days
//    anchor                        null | {amt (native), asOf, at, by} — the typed balance
//    legacy, old                   a v1 balance waiting to be confirmed, and its amount (native) to pre-fill
//    after, marks, est             native: statement rows dated after asOf; hand marks counted; anchor+after+marks
//    gbp                           est in GBP (null without an anchor)
//    cov, through, age             statements reach `cov` (later of sheetEnd and the bank's newest row, never past T);
//                                  through = later of asOf and cov; age = T − through in days (null if unknown)
//    stale                         "" | "ask" (9–15 days without a statement) | "old" (16+); material accounts only
//    handDays, handOld             days since the balance was typed; true when that is over 30 (material only)
//  missing[]                       keys of active accounts without an anchor (v0 ⇔ not empty)
//  now, nowApprox                  Σ gbp over anchored accounts, or null in v0; approx when an account is stale or
//                                  handOld, or a hand mark is counted in it
//  nowDate, nowAcct, nowIsToday    the oldest `through` among material accounts, whose it is, and whether it is
//                                  T−1 or later («Денег сейчас» rather than «Денег на {date}»)
//  marksGbp                        what hand marks add to `now` (signed)
//  series[]                        every key that has been regular in the last six due months, or was made by hand
//    sk                            "rev|client a", "cogs|person b", "tax|@mika" (a founder's own tax), "m|rent" (made
//                                  by «каждый месяц» for a name the table does not know)
//    blk, grp, list, dir           ledger block; block the month view counts it under (a founder for tax|@…);
//                                  the plan list its rows go to; +1 inflow / −1 outflow
//    label, E, day, g, bank, cur   name as the table spells it; usual amount; centre day 1..31; tolerance in days
//                                  (5..14); usual bank; the currency its statement rows are in
//    was, regular, stopped         paid in ≥ 4 of the 6 due cycles; … and in one of the last two; … and in neither
//    off, made, multi              «Больше не ждём»; made by hand; usually more than one payment a cycle
//    paid, due[], lastPaid         how many of the due cycles were paid; those cycles, newest first; the newest paid
//    lo, hi                        smallest and largest paid cycle (the editor's «обычно £lo–£hi»)
//    seen                          plan.ser[sk].seen
//  items[]                         everything the plan holds or expects, each once. Order: stored rows in plan order
//                                  (inflows, team, taxes, other), then occurrences by series and month, then VAT.
//    id                            a stored row's id; "h|<sk>|<YYYY-MM>" for an occurrence of a series (a stored row
//                                  with that id IS that occurrence); "v|2026Q3" for the VAT item of a quarter
//    src                           "row" stored | "occ" computed occurrence | "vat" computed VAT item
//    kind                          "typed" exact, a founder's | "hist" ≈, from history | "rule" ≈, VAT by revenue
//    list, blk, grp                inflows|team|taxes|other; block; block the month view counts it under
//    name, amt, cur, vat           as typed (amt before VAT, native). For hist and rule: what is still expected of
//                                  the month in GBP, or what was paid once it is done
//    dir, cash, full               ±1; signed GBP still expected of it (0 when done); signed GBP of the whole row
//    cashC                         what the cautious line counts for it (hist inflow × 0.75, hist outflow × 1.25)
//    exp, expDone                  what its month expects of it in the constructor, GBP, unsigned, and how much of
//                                  that has come: 0 for a row that is off, empty, gone or doubted. A list's
//                                  `expected` and `done` (months, below) are the sums of these over its rows
//    bank, acct                    its bank; the key of the account it is on ("" if none). A typed row is on the account
//                                  of its bank and currency; a forecast, stored or not, on its bank's GBP account or,
//                                  failing that, the bank's first one
//    date, ym                      its own date ("" undated); the month it belongs to in the constructor
//    on                            false = switched off
//    sk, how, label                series or label it is linked to; how: "name" exact · "rule" · "prefix" · "word" ·
//                                  "hand" · "stored" · "block" (a founder's block, studio tax) · "series" · "" unlinked
//                                  (it then closes by amount); the table's spelling of what it is linked to
//    cyc                           the cycle of its series it stands in (its own, or the one it is taken out of)
//    occ                           for an occurrence: {E, typ, got} — the month's usual amount, typed against it, paid
//                                  into it; what is still expected is E − typ − got. To store a forecast row (a date
//                                  move, a tick, a mark) write amt: occ.E with sure:false; to confirm one («Сумма
//                                  верная», sure:true) write amt: the item's amt — a confirmed row is a typed row
//    g, cov                        tolerance and coverage its state was measured with
//    state                         due      dated today or later
//                                  blind    past, and no statement of its bank reaches its date
//                                  waiting  past by no more than g days at the coverage date
//                                  late     past by more than g (lateDays; for a typed inflow step 1 = still in the
//                                           expected line, 2 = out of both)
//                                  unseen   marked paid, statements now cover that day and show nothing: open again
//                                           (a forecast for 45 days, then gone; a typed row until it is answered)
//                                  doubt    a later month of a client whose earlier month is late: in neither line
//                                  undated  a typed row without a date: in neither line
//                                  done     paid — see `done`
//                                  gone     history that is no longer waited for (45 days past, or covered)
//                                  off      switched off          empty   no amount yet
//    open                          true for due, blind, waiting, late, unseen
//    lateDays, step                coverage − date, when past; see `late`
//    day, dayC                     the day it is counted on in the expected / the cautious line ("" = not counted)
//    done                          null | {by, on, day, rows[], note, label, over}
//                                  by: "row" a statement row closed it · "mark" a hand mark no statement has reached
//                                  yet · "ok" «Всё верно» · "legacy" paid in the old Касса · "closed" «это всё»
//                                  on: the row's date, or the mark's; day: the day to list it under (brief F3 — a
//                                  mark under the item's own date, a row under the row's date)
//                                  note: "" · "amount" closed by amount, no name · "vat" · "sum" one payment for
//                                  several rows · "over" (+`over`, native) · "hand" · "mark" · "cycle" · "part"
//                                  label: how the table calls the first row that closed it
//    mark                          null | {on, at, by, counts, unseen, cov}; counts = it is inside `now`; cov = how
//                                  far the statements uploaded after the mark reach ("" = none has come yet)
//    part                          null | {got, of} native, VAT included — «частично £got из £of»
//    hint                          null | {id, d, amt, cur, label} — a row that looks like its payment but was on the
//                                  page before it was typed, or is 10–31 days early: «возможно, уже пришло»
//    rows[]                        ledger row ids matched to it          extra, sure, fixed, inv   as stored
//  avg{rev|cogs|small|behalf|mika|misha|vanya}   the average of what is NOT regular («в среднем»)
//    on, E                         switched on; the usual month — the median of the six months before the month
//                                  the ledger reaches — 0 when off
//    months{[ym]}                  from the month of T on: {used, left, perDay, from, to} — left is spread evenly;
//                                  inside (running month, when not 0): the part of `used` that no statement has
//                                  shown and a balance typed ahead of the statements already holds
//    lump                          null | {ym, left, through}: last month's remainder, counted on T while some account
//                                  in use is known only up to `through`, a day before that month's end
//  days[]                          one per day of W
//    d, in, out                    date; money in and out on the expected line that day (both ≥ 0, drips included)
//    inT, outT                     the typed and VAT part of them (the rest is history and average: hollow bars)
//    dripIn, dripOut               the average part of them
//    e                             expected balance at the end of the day
//    inC, outC, c                  the same for the cautious line
//    items[], itemsC[]             ids of the items counted on that day in each line
//  doneDays{[date]}                ids of done items by the day they are listed under, from T−31 on
//  IN, OUT, END, LOW, LOWDAY       sums of days[].in / .out; e on the last day; lowest e and its first day
//  IN_C, OUT_C, END_C, LOW_C, LOWDAY_C   the same on the cautious line
//  inParts{typed,hist,avg}  outParts{team,founders,taxes,other}   IN and OUT split for the KPI hints
//  LATE, late{n,name,days}         money later than its habit; how many payers, and the longest wait
//  need                            v0 only: what the accounts must hold today to pass W without a minus, plus cushion
//  plusDay                         first day after LOWDAY with e ≥ 0 ("" if none) — for verdict v4
//  minusDay, minus                 the first day with e < 0 and e on it ("" and 0 if none): the day money runs out,
//                                  which may be weeks before the deepest one
//  inbox{n,gbp,inN,inGbp,prov,provGbp}   rows in «Разбор»; the unrecognised incoming ones; the recognised ones the
//                                  forecast already counts
//  undated{n,gbp,ids[]}  between{n,gbp,ids[]}   typed rows without a date; open rows dated after the statements end
//                                  and on or before the typed balance — «возможно, посчитаны дважды»
//  verdict{id,asOf,subs[]}         id: v0 no balance · v4 minus · v3 under the cushion · vi inbox first · v2 fine if
//                                  clients pay as usual · v1 fine even cautiously. asOf: the date for «По остаткам
//                                  на …» ("" when balances are fresh). subs: the sub-lines that apply, in priority
//                                  order (draw the first two): "between" · "inbox" · "stale" · "cautious" · "typed"
//  cards[]                         «Нужно решить», in the order to show them. Each {n: the spec's card number, …}:
//    1  {accounts[{key,name,old}]}                                    no balance
//    4  {count, gbp}                                                  «Разбор» is not empty
//    7  {item, name, gbp, date, account, cov, days, step, left, hint} a typed inflow is late; left = days until it
//                                                                     leaves the expected line too
//    8  {item, name, gbp, date, account, cov, days, hint}             a typed or VAT outflow is late
//    9  {count, gbp, items[]}                                         typed rows without a date
//    10 {count, gbp, rows[]}                                          history that did not come true; a row is
//       {type:"late", item, sk, ym, label, dir, usual, day, days, gbp} — a month that did not come (an inflow is out of
//       both lines, a payout still in the cautious one) — or {type:"stopped", sk, label, dir, usual, ym, gbp} — two
//       months in a row did not; ym is what «Понятно» stores in plan.ser[sk].seen
//  month                           the running month (spec G)
//    ym, inInbox, through          month of T; how much of the fact is still in «Разбор»; newest row counted
//    byWord                        how much of the fact is lines paid on a founder's word that no filed row
//                                  carries yet: hand marks, and marks an unfiled row of «Разбор» has replaced
//    before{ym,in,out}             what the line counts today that is last month's and so is in no `rest`: lines
//                                  dated in an earlier month that no statement has reached, and avg[…].lump
//    blocks{rev,cogs,fixed,other,behalf,tax,mika,misha,vanya,founders,result}
//                                  each {fact, typed, hist, rest, total, usual}; rest = typed + hist
//    M_EXP                         blocks.result.total
//  months{list[], by{[ym]}}        the monthly constructor (brief F2). list: every month that has a row, and every
//                                  month from T's to that of T+60. by[ym][list] = {rows[], expected, done, avg}:
//                                  item ids in date order (undated last); what the month expects and how much of
//                                  it is done; what the block's average still holds for that month (a lump is
//                                  last month's, and stands on last month's page)
//
// WHAT THE SPEC LEFT OPEN, AND WHERE ITS LETTER WAS NOT KEPT
//  · A month that a statement closed is kept as a done item (state "done", note "cycle"), not dropped: the monthly
//    constructor shows a month whole, paid rows struck through. It counts in nothing.
//  · Occurrences are made from the first day of the month of T−45 to the end of the month of T+60, whatever H is,
//    so the constructor's months are whole. Only what falls in W reaches the lines, and an occurrence dated before
//    T−45 is never open: it is done, or "gone".
//  · A series made by «каждый месяц» has no occurrence dated before the day it was made.
//  · The average of fixed + other («small») is shown under Other in the month view.
//  · A forecast, stored or not, never calls for an account: it sits on its bank's own one. A founder who confirms a
//    forecast of a rouble client must not be told «Нет остатка: Tochka GBP».
//  · A hand mark is replaced by a statement row uploaded after the mark was made, or by one that sat in «Разбор» with
//    no block and no name when it was made (the spec says "any unclaimed row within −3…+7 days"). A row that was
//    already filed had been counted — as its client's month, or in an average — and a tap that silently re-filed it
//    moved END, against §5.2. An unfiled one had been counted in the balance only.
//  · A marked line is still offered to the statement rows by E3's own rules (the spec keeps marked lines to the mark
//    matcher): a payout that came 8% over, or in part, otherwise turned up unpaid again beside its own payment.
//  · A mark lasts until statements UPLOADED AFTER IT reach its day (the spec: until cov(X) ≥ paid.on). Coverage here
//    is the newest row of the bank; one row dated today in this morning's upload made every mark tapped today on
//    that bank dead at birth.
//  · B4(i) is kept though this deliverable takes the rows of a balance's own day to be inside it: the row that
//    closes a line marked AFTER the balance was typed counts on top of it, as the mark did. Of the rows that close a
//    marked forecast by its cycle, that is only those uploaded after the mark: the parts that were on the page
//    already had been taken out of what the mark was worth.
//  · A forecast marked paid has first claim on the rows of its own series (the spec's E4 sends every row to the
//    cycle nearest its date): a row uploaded after the mark and dated paid.on −3 … +7 pays the marked month, however
//    far from that month's usual day. «Оплачено» is one press on a forecast, so a client who pays three weeks early
//    is marked like any other — and by the letter that payment closed last month twice and this month never.
//  · A stored forecast row (h|sk|ym, sure:false) is worth E − typ − got of its cycle whatever has become of its
//    series — switched off by «Больше не ждём», gone quiet — and however old its month (the spec reckons a cycle
//    only for a series that is regular, inside the months occurrences are made for).
//  · A marked forecast the statements have gone past and not shown (`unseen`) is open for 45 days from its date or
//    its mark, whichever is later, and then "gone" like any forecast that did not come true (the spec keeps it open
//    until a founder answers). A typed row's mark is not dropped this way: that money is owed.
//  · A hint («возможно, уже пришло») is not raised by a row that is another month's payment of the same regular
//    series: last month's salary is always about this month's sum, a month early. "Another month" is measured from
//    the line's own date, not from the month D4 moved it to. For a payment that came after the line was typed, from
//    the client it names, the hint asks at 0.3–1.5 of the amount — E3's rule 4 outside the ten days.
//  · The six months of an average, and of «обычно», are the six before the month the ledger reaches (the spec: before
//    the month of T), so that nothing moves at midnight on the 1st.
//  · The share of the running month's average that falls between the statements' end and a balance typed after it
//    is counted as used: it is inside that balance.
//  · The month view (G): a line paid on a founder's word is fact (the spec has it in neither column); a line dated
//    in an earlier month that no statement has reached, and last month's lump, are in no `rest` — they are not this
//    month's — and are reported as month.before.
//  · «Что из этого уже прошло?» (Live.passed): lines are listed only while the statements stop short of the day the
//    balance is typed for; only a regular payout NO statement has reached is ticked beforehand; and the mark of a
//    ticked line is dated its own date or the day after the statements end, whichever is later — dated inside the
//    statements it would contradict them and reopen at once.
//  · Last month's remainder of an average (D6) is carried while an account in use is KNOWN only up to a day before
//    that month's end — known by its statements or by its typed balance, whichever reaches later (the spec looks at
//    statements alone). Every balance here is typed, and what moved before a balance was typed is inside it.
//  · The v1 → v2 upgrade hands out ids worked out from each row, not random ones, so it is a pure function.
//  · A one-off row marked paid ahead of its date is taken out of the average of the month of its DATE, as it was
//    while it was open (D6 says the month of the mark). Marked in October for 2 November, it otherwise handed

  return{id:it.id,tick:it.kind==="hist"&&it.dir<0&&it.state==="blind"&&plus(it.date,it.g)<=asOf,on:it.date>next?it.date:next};});

})();
// For the checks, and for a founder's console. compute is the engine itself and is pure; model() is the same run on

window.__money={compute:Live.compute,upgrade:Live.upgrade,passed:Live.passed,get today(){return Live.today();},get by(){return Plan.by();},

// ---------- the plan, as every tab reaches it ----------
// The plan document lives inside Cash, which loads it and saves it under its own revision. This is the one door to
// it. doc() is the document; model() the forecast worked out from it and the ledger, for today; edit(label, fn) one
// change — a copy kept for «Отменить», fn(plan, now, who) changing the document in place, the save, and every tab
// that shows the plan redrawn. A tab asks to be redrawn by watch(fn): fn runs after every change, and whenever one
// of the editing cards below opens or closes. «Касса» is such a tab like «Сегодня»; the one thing it does past this
// door is a keystroke in a row of a month, which it writes and saves itself so as not to be redrawn under the
// cursor. H is how far ahead to look, 30 or 60 days — a habit of whoever is looking, so it is kept in the browser
// and not in the plan.
const LOST="Не сохранено: план изменился в другом окне — обновите страницу";
const Plan=(()=>{
 const KEY="selfstudio-money-days",subs=[];let who="",H=60;
 try{if(localStorage.getItem(KEY)==="30")H=30;}catch(e){}
 const redraw=()=>subs.forEach(f=>f());
 return{doc:()=>Cash.plan(),by:()=>who,name(v){who=String(v||"").trim();},H:()=>H,watch(f){subs.push(f);},redraw,
  setH(v){H=v===30?30:60;try{localStorage.setItem(KEY,String(H));}catch(e){}redraw();},
  model:o=>Live.compute({tx:S.tx,inbox:S.inbox,rules:S.rules,fx:S.fx,history:S.history,aliases:S.aliases||{}},Cash.plan()||{},Live.today(),o||{H}),
  // Once somebody else has saved the plan, nothing changed on this page is kept. A change is then refused where it
  // is made, in the same breath that used to answer «Сохранено»: lost() says so and is true. Every hand that
  // changes the plan asks it first, and answers in its own words only after edit() has returned true.
  lost(){if(Cash.status()!=="stale")return false;toast(LOST);return true;},
  edit(label,fn){const P=Cash.plan();if(!P||this.lost())return false;Cash.snap(label);fn(P,Date.now(),who);Cash.changed();redraw();return true;},
  undo(){Cash.undo();}};
})();
Plan.watch(()=>Cash.draw());

// ---------- editing the plan: one row, a new row, the balances ----------
// Three cards. They are drawn wherever a tab asks for them and answered here, so «Сегодня» and «Касса» change the plan
// through the same hands and write the same things — the table «WHAT A TAP WRITES» at the head of the engine. One
// card is open at a time on the whole page. Every attribute and class starts with ed-. A tab's part of the bargain:
//  · Ed.use(M) before it draws — the model its rows come from;
//  · data-ed-open="<item id>" on a row (or a button) opens that item's card; where a tab draws one item in two
//    places, data-ed-at names the place; data-ed-focus="date" puts the cursor on the date;
//  · Ed.under(id, at) right after the row — the card, or nothing;
//  · data-ed-add opens «Добавить» (data-ed-add="inflows|team|taxes|other" skips its first question, data-ed-mon gives
//    the month an undated row belongs to); data-ed-bal opens «Вписать остаток» (data-ed-bal="<account key>" starts on
//    that account); Ed.sheet("add") and Ed.sheet("bal") where the two are to appear;
//  · data-ed-do="<verb>" data-ed-id="<item id>" does one thing at once, for a button outside the card: paid, unpaid,

//  · Ed.after(root) once its HTML is in the page: the card that has just opened is brought into view;
//  · Ed.sum(item) and Ed.remark(item) — a row's figure and the one thing it may say, as every list shows them;
//  · for a tab whose rows are typed into where they stand (the monthly constructor): Ed.apply(plan, item, row as it
//    should read, which fields changed, now, who) writes what the card's «Сохранить» would; Ed.does(verb, item id)
//    is a data-ed-do pressed from the script (a tick is not a button); Ed.names(list) the names the table offers.
const Ed=(()=>{
 const BLOCKS={inflows:["rev"],team:["cogs"],taxes:["tax"],other:["fixed","other","behalf"]},BLK0={inflows:"rev",team:"cogs",taxes:"tax",other:"other"};
 const WHAT=[["inflows","Поступление"],["team","Команда"],["taxes","Налог"],["founder","Фаундер"],["other","Прочий расход"]],NEW={inflows:"От кого",team:"Кому",taxes:"Какой налог",founder:"Название",other:"На что"};
 const FARMSG="Слишком далёкая дата: прогноз смотрит не дальше двух лет",NOZERO="Сумму не убрал. Если в этом месяце не будет — снимите галочку или нажмите «В этом месяце не будет»";
 let cur=null,fresh=false,M=null;
 const q=(el,s)=>el.querySelector(s),item=id=>(M&&M.items.find(x=>x.id===id))||null,ser=sk=>(sk&&M&&M.series.find(x=>x.sk===sk))||null;
 const stored=(P,it)=>P[it.list].find(r=>String(r.id)===it.id)||null,nat=(v,c)=>fmt(v,v%1?2:0,SYM[c]||"");
 // A line that history or the VAT rule put in the plan — written down already or not. Its amount may be corrected,
 // never emptied: an empty box would store the month as "nothing expected" without a word.
 const forecast=it=>{const P=Plan.doc(),r=P&&it.src==="row"?stored(P,it):null;return it.src!=="row"||!!(r&&r.src==="hist")||String(it.sk||"").startsWith("tax|vat|");};
 const okDate=d=>!d||(/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<=dAdd(Live.today(),731));
 const btn=(verb,label,it,cls)=>`<button class="sm${cls?" "+cls:""}" data-ed-do="${verb}" data-ed-id="${esc(it.id)}">${label}</button>`;
 const back=()=>Plan.undo();

 // What a row shows for money: the part still expected or, once it is done, what it came to. History wears «≈».
 function sum(it){const done=it.state==="done",v=done?(it.kind==="typed"?it.full:it.dir*it.amt):it.cash||it.full,a=Math.abs(v),s=it.dir>0?"+":"−";
  return it.kind!=="typed"&&!done?"≈"+s+fmt(sig2(a)):s+fmt(a,a%1?2:0);}
 // The one thing a row may say beyond its name, in plain words. Most rows say nothing: muted ink behind «≈» is
 // history already, and a line through a row is a row that is paid.
 function remark(it){const d=it.done,inn=it.dir>0;
  if(d)return d.by==="mark"?"отмечено · ждёт выписку":d.by==="ok"?"отмечено вручную":d.by==="legacy"?"отмечено в старой Кассе":d.by==="closed"?"закрыто частью"
   :d.note==="amount"&&d.label?`закрыто по сумме: ${d.label}`:d.note==="vat"?"пришло с VAT":d.note==="over"?`пришло больше на ${fmt(d.over)}`:d.note==="sum"?"одним платежом с другими":d.note==="part"?"пришла часть":"";
  if(it.state==="unseen")return `отмечено ${dRu(it.mark.on)}, в выписке нет`;
  if(it.part)return `частично ${nat(it.part.got,it.cur)} из ${nat(it.part.of,it.cur)}`;
  if(it.hint)return inn?"возможно, уже пришло":"возможно, уже оплачено";
  if(it.state==="late")return it.kind==="hist"?`ждём ${it.lateDays} дн.`:`просрочено ${it.lateDays} дн.`;
  if(it.state==="blind")return it.cov?`не видно: выписки по ${dRu(it.cov)}`:"не видно: выписок нет";
  return it.state==="doubt"?"под вопросом":it.state==="undated"?"без даты":it.state==="off"?"выключено":it.kind==="rule"?"по выручке":"";}

 // ---- what is written ----
 // The stored row of an item. A forecast has none until a founder touches it; then it is written down under the
 // item's own id — so two founders who touch the same month write the same row — with the month's usual amount,
 // unless the founder has just said what the amount is (`sure`).
 function own(P,it,sure,now,by){
  let r=stored(P,it);
  // Whoever asks for a row is about to write a decision into it, and from then on the row is the founder's to keep:
  // a mark that had written it down (mark, below) no longer takes it away with itself.
  if(r){if(r.paid&&typeof r.paid==="object")delete r.paid.made;return r;}
  if(it.src==="vat")r={id:uid(),name:it.name,amt:it.amt,cur:"GBP",bank:it.bank||"Barclays",on:true,tag:"",info:false,date:it.date,sk:it.sk,blk:"tax",c0:now,sure:true};
  else{const typed=it.kind==="typed";r={id:it.id,name:it.name,amt:typed||sure?it.amt:it.occ.E,cur:typed?it.cur:"GBP",bank:it.bank,on:true,tag:"",info:false,date:it.date,sk:it.sk,cyc:it.cyc,src:"hist",blk:it.blk,c0:now,sure:typed||!!sure};}
  r.m={t:now,by};P[it.list].push(r);return r;
 }
 // «Оплачено» / «Получено», for any line in one press. A line the page had only forecast — history, VAT by the
 // rule, a month of a «каждый месяц» row — is written down first, as it stands and not confirmed, and marked in the
 // same save: what the sheet of balances does to a ticked line («Что из этого уже прошло?»), which goes through here
 // too. So the engine has one kind of marked forecast to reckon with, whichever screen the press came from. The
 // mark remembers that it wrote the row (`made`): taken off again, it takes the row with it, and the month is the
 // forecast it was before the press — left behind, the row would hold the month to the amount and the day it
 // happened to have when somebody pressed, and would count a month the page had stopped counting on.
 function mark(P,it,on,at,now,by){const had=!!stored(P,it),r=own(P,it,false,now,by);r.paid={on,at,by};if(!had)r.paid.made=true;return r;}
 function unmark(P,it){const r=stored(P,it);if(!r)return;if(r.paid&&r.paid.made)P[it.list]=P[it.list].filter(x=>x!==r);else delete r.paid;}
 // The names the table knows for a list, newest first, each once.
 function names(list){const seen=new Set(),out=[],bl=BLOCKS[list]||[];
  S.tx.filter(r=>bl.includes(r.c)&&real(r)&&String(r.l||"").trim()).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0).forEach(r=>{const l=alias(r.l).trim(),n=norm(l);if(!n||seen.has(n)||out.length>=80)return;seen.add(n);out.push({l,c:r.c,n});});return out;}
 // A name chosen from the table's own is tied to it — and takes that name's block; any other name is looked up
 // afresh on every reckoning. Taxes and founders' draws are known by their block, never by a label.
 function relink(r,list){
  if(r.src==="hist"||/^(tax\||m\|)/.test(String(r.sk||""))||list==="taxes"||FOUNDERS.includes(r.blk))return;
  const n=norm(alias(r.name)),hit=n&&names(list).find(x=>x.n===n);
  if(hit){r.sk=hit.c+"|"+n;r.skBy="hand";r.blk=hit.c;}else{delete r.sk;delete r.skBy;r.blk=BLK0[list];}
 }
 // «каждый месяц»: the row becomes a series of its own — the same sum on the same day of every month from now on.
 // The row is tied to the series, so its own month is not expected a second time.
 function monthly(P,r,sk0,blk,on,now,by){
  const sk=String(r.sk||sk0||"")||"m|"+norm(r.name);
  if(on){P.ser[sk]=Object.assign({},P.ser[sk],{made:true,amt:(+r.amt||0)*(r.vat?1.2:1),cur:r.cur,day:+r.date.slice(8),bank:r.bank,blk,name:r.name,by,at:now});if(!r.sk)r.sk=sk;}
  else if(P.ser[sk]){["made","amt","cur","day","bank","blk","name"].forEach(k=>delete P.ser[sk][k]);if(!P.ser[sk].off&&!P.ser[sk].seen)delete P.ser[sk];if(String(r.sk||"").startsWith("m|"))delete r.sk;}
 }
 const vatUsual=name=>{const n=norm(alias(name));return !!n&&S.tx.filter(r=>r.c==="rev"&&real(r)&&norm(alias(r.l))===n).sort((a,b)=>a.d<b.d?1:-1).slice(0,3).filter(r=>r.v>0).length>=2;};

 // ---- one thing at once ----
 const VERBS={
  paid:[it=>`${it.dir>0?"Получено":"Оплачено"}: ${it.name}`,(P,it,now,by)=>{mark(P,it,Live.today(),now,now,by);}],
  unpaid:[it=>`Вернул в план: ${it.name}`,(P,it)=>{unmark(P,it);}],
  ok:[it=>`Подтверждено: ${it.name}`,(P,it)=>{const r=stored(P,it);if(r&&r.paid&&typeof r.paid==="object")r.paid.ok=true;}],
  sure:[it=>`В плане: ${it.name} ${nat(it.amt,"GBP")}`,(P,it,now,by)=>{const r=own(P,it,true,now,by);r.sure=true;r.amt=it.amt;r.m={t:now,by};}],
  skip:[it=>`${it.name}: в этом месяце не жду`,(P,it,now,by)=>{const r=own(P,it,false,now,by);r.on=false;r.offAt=now;r.m={t:now,by};}],
  on:[it=>`${it.name}: снова в расчёте`,(P,it,now,by)=>{const r=stored(P,it);if(r){r.on=true;delete r.offAt;r.m={t:now,by};}}],
  stop:[it=>`${it.name}: больше не жду`,(P,it,now,by)=>{P.ser[it.sk]=Object.assign({},P.ser[it.sk],{off:true,by,at:now});}],
  tx:[it=>`Закрыто: ${it.name}`,(P,it,now,by)=>{const r=own(P,it,false,now,by);r.tx=(r.tx||[]).concat([it.hint.id]);}],
  notx:[it=>`${it.name}: жду дальше`,(P,it,now,by)=>{const r=own(P,it,false,now,by);r.notx=(r.notx||[]).concat([it.hint.id]);}],
  closed:[it=>`Закрыто: ${it.name}`,(P,it)=>{const r=stored(P,it);if(r)r.closed=true;}],
  del:[it=>`Удалено: ${it.name}`,(P,it)=>{P[it.list]=P[it.list].filter(r=>String(r.id)!==it.id);}],

 function act(verb,x){
  if(Plan.lost())return;

  const it=item(x.dataset.edId),V=VERBS[verb];if(!it||!V||((verb==="tx"||verb==="notx")&&!it.hint))return;
  if(verb==="del"&&!x.dataset.armed){x.dataset.armed="1";x.textContent="Точно удалить?";x.classList.add("danger");return;}
  const say=V[0](it);cur=null;if(Plan.edit(say,(P,now,by)=>V[1](P,it,now,by)))toast(say,back);
 }

 // ---- the card of one row ----
 function why(it,r){
  const s=ser(it.sk),d=it.done,inn=it.dir>0,out=[];
  if(it.kind==="hist")out.push(s?`По истории: ${inn?"платили":"платим"} ${s.paid} из ${s.due.length||6} месяцев, обычно ${s.lo===s.hi?fmtK(s.lo):fmtK(s.lo)+"–"+fmtK(s.hi)}, около ${s.day}-го.`:"По истории.");
  else if(it.kind==="rule")out.push("По выручке: VAT, который был в счетах клиентов за этот квартал.");
  else if(it.src==="occ")out.push(`Каждый месяц: ${nat(it.amt,it.cur)} около ${s?s.day:+it.date.slice(8)}-го.`);
  else{const at=r&&+r.c0,by=r&&r.m&&r.m.by,sk=String(it.sk||"");
   out.push(`В плане: ${at?(by?`вписал ${by} `:"вписано ")+dRu(Live.day(at)):"из старой Кассы"} · ${sk.startsWith("tax|@")?"личный налог "+(FN[it.grp]||""):sk.startsWith("tax|vat|")?"VAT за квартал":sk.startsWith("m|")?"повторяется каждый месяц":it.how==="block"?(FOUNDERS.includes(it.blk)?"вывод "+FN[it.blk]:"налог студии — закрою по сумме"):it.how&&it.label?`в таблице это ${it.label}`:"такого названия в таблице нет — закрою по сумме"}.`);}
  if(d)out.push(d.by==="row"?`${d.note==="amount"?"Закрыто по сумме":"Закрыто выпиской"}${d.label||d.on?": "+[d.label,d.on?dRu(d.on):""].filter(Boolean).join(", "):""}.`:d.by==="mark"?`Отмечено вручную ${dRu(d.on)}${it.mark&&it.mark.by?" · "+it.mark.by:""}. Когда выписка дойдёт до этого дня, сверю.`:d.by==="ok"?"Отмечено вручную, подтверждено.":d.by==="legacy"?"Отмечено ещё в старой Кассе.":"Закрыто: остаток по этой строке не жду.");
  else if(it.state==="unseen")out.push(`Отмечено ${dRu(it.mark.on)}, но в выписках ${it.bank} по ${dRu(it.mark.cov||it.cov)} такой суммы нет. Пока снова считаю ${inn?"неполученным":"неоплаченным"}.`);
  else if(it.part)out.push(`Пришла часть: ${nat(it.part.got,it.cur)} из ${nat(it.part.of,it.cur)}.`);
  else if(it.state==="late")out.push(it.kind==="hist"?`На ${it.lateDays} дн. позже обычного: в выписках ${it.bank} по ${dRu(it.cov)} ${inn?"денег":"платежа"} нет.`:`Просрочено на ${it.lateDays} дн.: в выписках ${it.bank} по ${dRu(it.cov)} ${inn?"денег":"платежа"} нет.`);

  else if(it.state==="doubt")out.push("Прошлый месяц этого клиента не пришёл, поэтому этот пока не считаю.");
  else if(it.state==="off")out.push("Выключено: в расчёт не идёт.");
  const hint=it.hint&&!d?`<div class="row"><span>Похоже, уже ${inn?"пришло":"оплачено"}: ${inn?"+":"−"}${nat(it.hint.amt,it.hint.cur)} · ${dRu(it.hint.d)}${it.hint.label?" · "+esc(it.hint.label):""}</span>${btn("tx","Это оно",it)}${btn("notx",inn?"Нет, это новый счёт":"Нет, это другой платёж",it)}</div>`:"";
  return `<div class="ed-why">${esc(out.join(" "))}${hint}</div>`;
 }
 // By what the row is and where it stands. «Получено» / «Оплачено» comes first on every open row, a forecast's
 // as well: it is what a row is most often opened for. What only a forecast can be told follows it.
 function actions(it){
  const inn=it.dir>0,late=it.state==="late",d=it.done,b=(v,l,c)=>btn(v,l,it,c),pay=b("paid",inn?"Получено":"Оплачено");
  // «Всё верно» belongs to a mark the statements have gone past and not shown: it says the money moved some other
  // way and nothing is owed. On a mark that still stands in for its payment it would take that payment out of
  // «сейчас» and out of the plan together — the page would be richer by exactly what was just paid.
  if(d)return d.by==="mark"||d.by==="ok"||d.by==="legacy"?b("unpaid","Вернуть в план"):"";
  if(it.state==="unseen")return b("unpaid","Вернуть в план")+b("ok","Всё верно");
  if(it.state==="off"||it.state==="empty"||it.state==="undated"||it.state==="gone")return it.src==="row"&&it.kind==="typed"?b("del","Удалить","ghost"):"";
  // «Сумма верная» is offered on a late forecast as well, beside «Жду до…»: the card is the only place left to
  // agree with a forecast's amount, now that the row itself ends in the mark.
  if(it.kind==="hist")return pay+(late?b("move","Жду до…"):"")+b("sure","Сумма верная")+b("skip","В этом месяце не будет")+b("stop","Больше не ждём");
  if(it.part)return b("closed","Это всё")+b("del","Удалить","ghost");
  if(it.src!=="row")return pay+b("move","Перенести на…")+b("skip",inn?"В этом месяце не будет":"В этом месяце не платим");
  if(late)return pay+b("move","Перенести на…")+b("skip",inn?"Не придёт":"Не платим");
  return pay+(inn?"":b("move","Перенести на…"))+b("del","Удалить","ghost");
 }
 function fields(v,o){
  const box=(k,on,label)=>`<label class="ed-chk"><input type="checkbox" data-ed-f="${k}"${on?" checked":""}><span>${label}</span></label>`;
  const boxes=(o.vat!==undefined?box("vat",o.vat,"+ VAT 20%"):"")+(o.monthly!==undefined?box("monthly",o.monthly,"каждый месяц"):"")+(o.extra?box("extra",o.extra.on,"это сверх обычного"):"");

  if(!(v.amt>0)&&forecast(it))return miss(card,"amt",NOZERO);
  if(!okDate(v.date))return miss(card,"date",FARMSG);
  if(v.mon&&!v.date)return miss(card,"date","Чтобы повторять каждый месяц, нужна дата");

 // What a change to a row's fields writes. `v` is the row as it should now read, `ch` names the fields that differ
 // (v.mon is «каждый месяц»; left out, it stays as it was). The card's «Сохранить» writes through here, and so does
 // every cell of the monthly constructor — one field at a time, as it is typed. A forecast touched this way is
 // written down under its own id: with the amount a founder typed it is a typed row from then on, with only a new
 // date or bank it stays a forecast. Returns the stored row (its id is new for the VAT item, which had none).

  const s=ser(it.sk),was=!!(s&&s.made),mon=v.mon===undefined?was:v.mon;

  const r=own(P,it,ch.amt,now,by);
  if(ch.name){r.name=v.name;relink(r,it.list);}
  if(ch.amt){r.amt=v.amt;if(r.src==="hist")r.sure=true;}
  if(ch.cur)r.cur=v.cur;if(ch.bank)r.bank=v.bank;
  if(ch.date){r.date=v.date;if(v.date)delete r.mon;else r.mon=it.ym;}
  if(ch.vat){if(v.vat)r.vat=true;else delete r.vat;}
  if(ch.extra){if(v.extra)r.extra=true;else delete r.extra;}

  if(ch.mon||(was&&mon&&r.date&&it.src==="row"&&r.src!=="hist"&&(ch.amt||ch.date||ch.bank||ch.cur||ch.name||ch.vat)))monthly(P,r,it.sk,r.blk||it.blk,mon,now,by);

 }

 // ---- «Вписать остаток» ----
 // Every account at once, each with what the page works it out to be. Only an account a founder touches is saved.
 // Under a touched account come the lines dated on or before the balance's day that no statement has shown yet: any
 // of them may already be inside the figure being typed, and ticking one says so — it is then not counted again.
 function balCard(){
  const T=M.T,rank=a=>a.active&&!a.anchor?0:a.active?1:2,list=M.accounts.filter(a=>a.inPlan||a.active).sort((a,b)=>rank(a)-rank(b));
  const rows=list.map(a=>{const sym=SYM[a.cur]||"",A=a.anchor,old=a.legacy&&a.old;
   const hint=A?`по расчёту ${nat(a.est,a.cur)} · вписан ${dRu(A.asOf)}${A.by?", "+A.by:""}`:old?`в старой Кассе было ${nat(a.old,a.cur)} — подтвердите сумму и дату`:a.active?"остатка нет":"счёт не используется";
   return `<div class="ed-acct" data-ed-acct="${esc(a.key)}"><div class="ed-an"><b>${esc(a.name)}</b><span class="note">${esc(hint)}</span></div>
    <label class="fld"><span>Остаток, ${esc(sym.trim()||a.cur)}</span><input type="number" step="any" inputmode="decimal" data-ed-bamt value="${A?a.est:old?a.old:""}" aria-label="Остаток ${esc(a.name)}"></label>

   <div class="note">Впишите, сколько на счёте по банку, и на какой день это верно: сегодня — значит «на сейчас», день раньше — на конец того дня. Дальше считаю сам: по выпискам и по тому, что отмечено оплаченным.</div>
   ${rows||'<div class="note">Счетов пока нет: они появятся с первой выпиской.</div>'}
   <div class="ed-foot"><span></span><div class="row"><button class="sm ghost" data-ed-x>Закрыть</button><button class="sm primary" data-ed-save>Сохранить</button></div></div></article>`;
 }
 const acctOf=box=>M.accounts.find(a=>a.key===box.dataset.edAcct);

 function balSave(card){
  const T=Live.today(),jobs=[];if(Plan.lost())return;

})();

// ---------- the balance by day, as «Сегодня» and «Касса» both draw it ----------
// Drawn to the width it is given, like the page's other charts. `D` is one cell a day — {d, e, c, in, inT, out, outT}:
// the balance at the end of the day on the expected line and on the cautious one; the day's money in and out, and
// the part of each that a founder typed (or that is VAT by the rule). A filled bar is that part, a hollow one what
// history and the averages add. On a phone the bars are a week each: sixty do not fit.
// o: start — the balance the line sets out from; cush — the cushion, 0 for none; rel — the figures are a change
// from an unknown balance, not a balance; low — the day to name the lowest point on; attr — the attribute that
// numbers the days' hit areas; pick(d) — what a tap on a day does; two — draw the cautious line as well. Without
// `two` the cells' `c` is not looked at: the scale is the expected line's, the bars' and the cushion's alone, so a
// scenario nobody asked to see cannot flatten the line they are reading. Returns the width it drew to.
function dayChart(svg,D,o){
  const n=D.length,W=Math.max(300,Math.round(svg.parentElement.clientWidth)||860),small=W<520,Hh=small?190:250,L=46,R=10,Tp=14,B=26,slot=(W-L-R)/n,cx=i=>L+slot*(i+.5);
  const start=o.start,cush=o.cush||0,two=!!o.two,lowest=x=>two?Math.min(x.e,x.c):x.e,wk=small?7:1,bars=[];
  for(let i=0;i<n;i+=wk){const g=D.slice(i,i+wk),s=k=>g.reduce((a,x)=>a+x[k],0);bars.push({x:L+slot*(i+g.length/2),in:s("in"),inT:s("inT"),out:s("out"),outT:s("outT")});}
  let mx=Math.max(0,start,cush,...D.map(x=>Math.max(x.e,two?x.c:x.e)),...bars.map(b=>b.in)),mn=Math.min(0,start,...D.map(lowest),...bars.map(b=>-b.out));if(mx-mn<1000){mx+=500;mn-=500;}
  const step=niceStep((mx-mn)/(small?4:5));mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
  const y=v=>Tp+(Hh-Tp-B)*(mx-v)/(mx-mn||1),f1=v=>Math.round(v*10)/10;let g="";
  // A minus is tinted where it is: under the expected line, on the days it is below zero. (The cautious line, where
  // it is drawn, goes below zero in most months; tinting the whole lower half for it would cry wolf.)
  if(!o.rel)D.forEach((x,i)=>{if(x.e<0)g+=`<rect x="${f1(L+slot*i)}" y="${f1(y(0))}" width="${f1(slot+.4)}" height="${f1(y(x.e)-y(0))}" fill="var(--bad-dim)"/>`;});
  for(let v=mn;v<=mx+1e-6;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${f1(y(v))}" y2="${f1(y(v))}" stroke="var(${Math.abs(v)<1e-6?"--border-strong":"--grid"})" stroke-width="${Math.abs(v)<1e-6?1.5:1}"/><text x="${L-8}" y="${f1(y(v)+4)}" text-anchor="end">${o.rel&&v>0?"+":""}${fmtK(v)}</text>`;
  const bw=Math.max(2,Math.min(small?11:16,slot*wk*.55)),bar=(x,a,b,col,hollow)=>{const y0=Math.min(y(a),y(b)),h=Math.abs(y(a)-y(b));if(h<(hollow?2:.6))return "";
   return hollow?`<rect x="${f1(x-bw/2+.5)}" y="${f1(y0+.5)}" width="${f1(bw-1)}" height="${f1(Math.max(1,h-1))}" fill="var(--panel)" stroke="var(${col})" stroke-width="1"/>`:`<rect x="${f1(x-bw/2)}" y="${f1(y0)}" width="${f1(bw)}" height="${f1(Math.max(1,h))}" fill="var(${col})"/>`;};
  bars.forEach(b=>{g+=bar(b.x,0,b.inT,"--s1")+bar(b.x,b.inT,b.in,"--s1",1)+bar(b.x,0,-b.outT,"--s2")+bar(b.x,-b.outT,-b.out,"--s2",1);});
  if(cush>0&&cush<=mx)g+=`<line x1="${L}" x2="${W-R}" y1="${f1(y(cush))}" y2="${f1(y(cush))}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  const path=k=>{let d=`M${L} ${f1(y(start))} H${f1(cx(0))}`;D.forEach((x,i)=>{d+=`${i?` H${f1(cx(i))}`:""} V${f1(y(x[k]))}`;});return d+` H${W-R}`;};
  if(two)g+=`<path d="${path("c")}" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  g+=`<path d="${path("e")}" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linejoin="round"/>`;
  const lo=D.findIndex(x=>x.d===o.low);
  // The lowest point is named beside its dot — above it when the dot sits just over the zero line, where the bars are.
  if(lo>=0){const v=D[lo].e,below=y(v)+22<Hh-B&&!(v>=0&&y(0)-y(v)<34),ink=`var(${v<0&&!o.rel?"--mark-crit":"--text-primary"})`;
   g+=`<circle cx="${f1(cx(lo))}" cy="${f1(y(v))}" r="4" fill="${ink}" stroke="var(--panel)" stroke-width="2"/><text x="${f1(cx(lo))}" y="${f1(below?y(v)+18:y(v)-10)}" text-anchor="${lo>n-6?"end":lo<4?"start":"middle"}" style="fill:${ink};font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round">${o.rel&&v>0?"+":""}${fmtK(v)}</text>`;}
  const every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor((W-L-R)/62))));
  D.forEach((x,i)=>{if((i%every===0&&n-1-i>=every*.9)||i===n-1)g+=`<text x="${f1(cx(i))}" y="${Hh-8}" text-anchor="${i===n-1?"end":i===0?"start":"middle"}"${i===0?' style="fill:var(--ink);font-weight:600"':""}>${dRu(x.d)}</text>`;});
  D.forEach((x,i)=>{g+=`<rect class="hit" ${o.attr}="${i}" x="${f1(L+slot*i)}" y="${Tp}" width="${f1(slot)}" height="${Hh-Tp-B}" fill="transparent"/>`;});
  svg.setAttribute("viewBox",`0 0 ${W} ${Hh}`);svg.innerHTML=g;
  const box=svg.parentElement,tip=box.querySelector(".tip");
  svg.querySelectorAll(".hit").forEach(r=>{const x=D[+r.getAttribute(o.attr)];
   r.addEventListener("mouseenter",()=>{tip.innerHTML=`<div style="font-weight:600;margin-bottom:4px">${dRuW(x.d)}</div><div class="tr"><span>Придёт</span><span>+${fmt(x.in)}</span></div><div class="tr"><span>Уйдёт</span><span>−${fmt(x.out)}</span></div><div class="tr"><span><b>${o.rel?"Изменение":"Остаток"}</b></span><span><b>${fmt(x.e)}</b></span></div>${two?`<div class="tr"><span>Осторожно</span><span>${fmt(x.c)}</span></div>`:""}`;
    tip.hidden=false;const bx=box.getBoundingClientRect(),rb=r.getBoundingClientRect();let left=rb.left-bx.left+rb.width+6;if(left+200>bx.width)left=rb.left-bx.left-206;tip.style.left=Math.max(0,left)+"px";});
   r.addEventListener("mouseleave",()=>{tip.hidden=true;});
   if(o.pick)r.addEventListener("click",()=>o.pick(x.d));});
  return W;
}

// ---------- «Сегодня» ----------
// The first screen: one sentence that says whether the money lasts, six figures, the balance by day, what needs a
// decision, the next fortnight row by row, and the running month as fact plus plan. It works nothing out: every
// figure is the engine's (Live.compute), and each figure's element carries data-live="<key>" and data-v="<the
// number, two decimals>" so a check can hold the screen against the model. It is drawn only while it is the tab in
// view, and from scratch each time — its rows hold no state of their own; the cards that edit are Ed's.
const Today=(()=>{
 const root=$("#view-today"),LISTS=["inflows","team","taxes","other"];
 const BL=[["rev","Выручка"],["cogs","COGS"],["fixed","Fixed"],["other","Other"],["behalf","За клиентов"],["tax","Налоги студии"],["founders","Фаундеры"],["result","Результат"]];
 const st={all:false,past:false,more:false,acc:false,day:"",undated:false,hist:false};
 let M=null,by={},chartW=0;
 const num=v=>typeof v==="number"?v.toFixed(2):esc(v==null?"":v);
 const lv=(k,v,text)=>`<span data-live="${k}" data-v="${num(v)}">${text}</span>`;
 const acc=k=>M.accounts.find(a=>a.key===k)||null,natv=(v,c)=>fmt(v,v%1?2:0,SYM[c]||"");
 const count=(n,a,b,c)=>`${n} ${plural(n,a,b,c)}`;

 // ---- the sentence ----
 function verdict(){
  // When the newest balance or statement is older than yesterday the sentence says as of which day it speaks.
  const v=M.verdict,H=M.H,pre=v.asOf?`По остаткам на ${dRuF(v.asOf)}`:"",cap=(s,join)=>pre?pre+(join||": ")+s[0].toLowerCase()+s.slice(1):s;let s,btn="";
  if(v.id==="v0"){const who=M.missing.map(k=>acc(k).name);
   s=`Нет остатка: ${who.join(", ")}. Без ${who.length>1?"них":"него"} итог не посчитать. По истории за ${H} дней придёт ${approx(M.IN)} и уйдёт ${approx(M.OUT)}.`;
   // Only a typed balance is a way out of here: a statement brings rows, and no balance, until the page reads
   // balances off statements. So the one button is the one that works; «Загрузить выписки» stays under «Счета».
   btn='<button class="primary" data-ed-bal>Вписать остатки</button>';}
  // The day the money runs out comes first: that is the day to act by. The deepest day may be weeks later, and
  // named alone it read as "nothing to do until December" with a minus four days off.
  else if(v.id==="v4"){const out=M.plusDay?`В плюс выходим ${dRuF(M.plusDay)}.`:"До конца периода в плюс не выходим.";
   s=cap(M.minusDay&&M.minusDay!==M.LOWDAY?`${dRuF(M.minusDay)} не хватит ${fmt(-M.minus)} — это первый минус. Глубже всего ${dRuF(M.LOWDAY)}: не хватит ${fmt(-M.LOW)}. ${out}`:`${dRuF(M.LOWDAY)} не хватит ${fmt(-M.LOW)}. ${out}`);
   btn=`<button data-td-days="${M.minusDay||M.LOWDAY}" data-td-why>Как закрыть</button>`;}
  else if(v.id==="v3"){s=cap(`Хватает, но впритык: ${dRuF(M.LOWDAY)} останется ${fmt(M.LOW)} — меньше запаса ${fmt(M.cushion)}.`," ");btn=`<button data-td-days="${M.LOWDAY}" data-td-why>Как подстраховаться</button>`;}
  else if(v.id==="vi"){s=`Сначала разберите ${count(M.inbox.inN,"поступление","поступления","поступлений")} на ${fmt(M.inbox.inGbp)}: часть ожидаемых денег, возможно, уже пришла.`;btn='<button class="primary" data-tabgo="inbox">Разобрать</button>';}
  // v1 says the money lasts on the cautious line as well. Where that line is not shown the sentence cannot lean on
  // it, and v1 and v2 read alike: enough, if clients pay as usual.
  else s=cap(`Денег хватает на ${H} дней${v.id==="v1"&&M.cautious?" даже при осторожном сценарии":", если клиенты заплатят как обычно"}. Нижняя точка — ${fmt(M.LOW)}, ${dRuF(M.LOWDAY)}.`);
  const old=M.accounts.find(a=>a.stale||a.handOld);
  const SUB={
   between:()=>`${count(M.between.n,"строка","строки","строк")} на ${fmt(M.between.gbp)} между выписками и вписанным остатком — возможно, ${M.between.n===1?"посчитана":"посчитаны"} дважды.`,
   inbox:()=>`В разборе ${count(M.inbox.n,"операция","операции","операций")} на ${fmt(M.inbox.gbp)} — пока ${M.inbox.n===1?"она не разнесена":"они не разнесены"}, часть плана может считаться дважды.`,
   stale:()=>old?`Остаток ${old.name} — от ${dRu(old.stale?old.through:old.anchor.asOf)}: всё, что было позже, считаю по плану.`:"",
   cautious:()=>M.LOW_C<0?`При осторожном сценарии ${dRuF(M.LOWDAY_C)} не хватит ${fmt(-M.LOW_C)}.`:`При осторожном сценарии нижняя точка — ${fmt(M.LOW_C)}, ${dRuF(M.LOWDAY_C)}.`,
   typed:()=>`Из ${fmt(M.IN)} ожидаемых поступлений в плане ${fmt(M.inParts.typed)}, остальное — по истории и в среднем.`};
  const subs=v.subs.filter(k=>k!=="cautious"||M.cautious).map(k=>SUB[k]?SUB[k]():"").filter(Boolean).slice(0,2);
  return `<section class="card td-verdict td-${v.id}" aria-label="Итог"><p class="td-say" data-live="verdict" data-v="${v.id}">${esc(s)}</p>${subs.map(x=>`<p class="note">${esc(x)}</p>`).join("")}${btn?`<div class="row">${btn}</div>`:""}</section>`;
 }

 // ---- six figures ----
 // They are the head of «Касса» as well, from the same model: the two tabs cannot disagree about a figure they both
 // print. `cls` is a class for the row itself («Касса» makes it stick under the top bar).
 function kpis(M,cls){
  const acc=k=>M.accounts.find(a=>a.key===k)||null;
  const H=M.H,b=M.month.blocks.result,kp=(label,val,hint,o)=>`<div class="kpi${o&&o.hot?" hot":""}${o&&o.tap?" td-kpi":""}"${o&&o.tap?' data-ed-bal role="button" tabindex="0" title="Вписать остаток"':""}><div class="lbl">${label}</div><div class="val${o&&o.cls?" "+o.cls:""}">${val}</div><div class="hint">${hint}</div></div>`;
  const known=M.accounts.filter(a=>a.anchor).length;
  const now=M.v0?kp("Денег сейчас",lv("now","","—"),`не хватает остатка: ${esc(M.missing.map(k=>acc(k).name).join(", "))}`,{tap:1})
   :kp(M.nowIsToday?"Денег сейчас":`Денег на ${dRu(M.nowDate)}`,lv("now",M.now,(M.nowApprox?"≈":"")+fmt(M.now)),`выписки и остатки по ${dRu(M.nowDate)} · ${count(known,"счёт","счёта","счетов")}${M.marksGbp?` · в т.ч. отмечено вручную ${lv("marks",M.marksGbp,(M.marksGbp>0?"+":"")+fmt(M.marksGbp))}`:""}`,{tap:1});
  const low=M.v0?kp("Нужно на счетах сегодня",lv("low",M.need,fmt(M.need)),`чтобы пройти ${H} дней без минуса${M.cushion?` и с запасом ${fmt(M.cushion)}`:""}`,{hot:1})
   :kp("Нижняя точка",lv("low",M.LOW,fmt(M.LOW)),`${lv("lowday",M.LOWDAY,dRu(M.LOWDAY))}${M.minusDay&&M.minusDay!==M.LOWDAY?` · первый минус ${lv("minusday",M.minusDay,dRu(M.minusDay))}`:""}${M.cautious?` · осторожно ${lv("lowc",M.LOW_C,fmt(M.LOW_C))}${M.LOWDAY_C!==M.LOWDAY?" "+lv("lowcday",M.LOWDAY_C,dRu(M.LOWDAY_C)):`<span data-live="lowcday" data-v="${M.LOWDAY_C}"></span>`}`:""}`,{hot:1,cls:M.LOW<0?"neg":M.LOW<M.cushion?"td-amber":""});
  return `<section class="kpis${cls?" "+cls:""}" aria-label="Шесть цифр">${now}
   ${kp(`Придёт за ${H} дней`,lv("in",M.IN,fmt(M.IN)),`в плане ${lv("in.typed",M.inParts.typed,fmtK(M.inParts.typed))} · по истории ${lv("in.hist",M.inParts.hist,"≈"+fmtK(M.inParts.hist))} · в среднем ${lv("in.avg",M.inParts.avg,"≈"+fmtK(M.inParts.avg))}`)}
   ${kp(`Уйдёт за ${H} дней`,lv("out",M.OUT,fmt(M.OUT)),`команда ${lv("out.team",M.outParts.team,fmtK(M.outParts.team))} · фаундеры ${lv("out.founders",M.outParts.founders,fmtK(M.outParts.founders))} · налоги ${lv("out.taxes",M.outParts.taxes,fmtK(M.outParts.taxes))} · прочее ${lv("out.other",M.outParts.other,fmtK(M.outParts.other))}`)}
   ${low}
   ${kp("Ждём и не пришло",lv("late",M.LATE,fmt(M.LATE)),M.LATE>0?`${count(M.late.n,"клиент","клиента","клиентов")} · дольше всех ${esc(M.late.name)}, ${M.late.days} дн.`:"все платят как обычно")}
   ${kp(`${MONF[+M.month.ym.slice(5)-1]}: результат`,lv("mexp",M.month.M_EXP,fmt(M.month.M_EXP)),`факт ${fmtK(b.fact)} · ещё по плану ${fmtK(b.rest)}`)}
  </section>`;
 }

 // ---- the accounts, in one line ----
 function accounts(){
  const A=M.accounts.filter(a=>a.inPlan||a.active).sort((a,b)=>Math.abs(b.gbp||0)-Math.abs(a.gbp||0)),top=A.find(a=>a.anchor),miss=M.missing.map(k=>acc(k).name);
  const head=miss.length?`нет остатка — ${esc(miss.join(", "))}`:top?`${esc(top.name)} ${natv(Math.round(top.est),top.cur)} по ${dRu(top.through)}${A.length>1?` · ещё ${A.length-1}`:""}`:"остатки не вписаны";
  const row=a=>{const A0=a.anchor,words=[];
   if(A0){words.push(`вписан ${dRu(A0.asOf)}${A0.by?", "+A0.by:""}`);if(a.cov&&a.cov>A0.asOf)words.push(`выписки по ${dRu(a.cov)}`);
    if(a.stale)words.push(a.stale==="old"?`устарел · ${a.age} дн. без выписки`:`${a.age} дн. без выписки`);else if(a.handOld)words.push(`вписан ${a.handDays} дн. назад — сверьте с банком`);}
   else words.push(a.active?(a.legacy&&a.old?`нет остатка · в старой Кассе было ${natv(a.old,a.cur)}`:"нет остатка"):"не используется");
   return `<span>${esc(a.name)}</span><span class="mono" data-live="acct.${esc(a.key)}" data-v="${num(a.est)}">${A0?natv(round2(a.est),a.cur)+(a.cur!=="GBP"?` <span class="td-meta">${fmt(a.gbp)}</span>`:""):"—"}</span><span class="td-meta">${esc(words.join(" · "))}</span>`;};
  return `<details class="td-acc"${st.acc?" open":""}><summary><span class="lbl">Счета</span>${head}</summary><div class="td-accs">${A.map(row).join("")}<div class="row"><button class="sm" data-ed-bal>Вписать остаток</button><button class="sm ghost" data-tabgo="upload">Загрузить выписки</button></div></div></details>`;
 }

 // ---- what needs a decision ----
 const open=(id,label,focus,cls)=>`<button class="sm${cls?" "+cls:""}" data-ed-open="${esc(id)}" data-ed-at="need"${focus?` data-ed-focus="${focus}"`:""}>${label}</button>`;
 const act=(verb,id,label)=>`<button class="sm" data-ed-do="${verb}" data-ed-id="${esc(id)}">${label}</button>`;
 function card(c){
  const op=(title,text,btns,more)=>`<article class="op" data-td-card="${c.n}"><div class="op-name">${title}</div>${text?`<div class="op-text">${text}</div>`:""}${btns?`<div class="row">${btns}</div>`:""}${more||""}</article>`;
  if(c.n===1){const old=c.accounts.filter(a=>a.old);
   return op(`Нет остатка: ${esc(c.accounts.map(a=>a.name).join(", "))}`,old.length?`В старой Кассе было ${esc(old.map(a=>`${a.name} ${natv(a.old,a.key.split("|")[1])}`).join(", "))} — подтвердите сумму и дату.`:"Впишите один раз — дальше считаю по выпискам.",'<button class="sm primary" data-ed-bal>Вписать остатки</button>');}
  if(c.n===4)return op(`В разборе ${count(c.count,"операция","операции","операций")} на ${fmt(c.gbp)}`,`Пока ${c.count===1?"она не разнесена":"они не разнесены"}, план не может закрыть свои строки.`,'<button class="sm" data-tabgo="inbox">Разобрать</button>');
  if(c.n===7||c.n===8){const it=by[c.item],inn=c.n===7,h=c.hint;if(!it)return "";
   const text=inn?`Ждали ${dRu(c.date)}, в выписках ${esc(c.account)} по ${dRu(c.cov)} его нет · ${c.days} дн. ${c.step===1?`${M.cautious?"В осторожной линии уже не считаю; из":"Из"} расчёта уберу через ${c.left} дн.`:"Из расчёта убран, пока не перенесёте."}`
    :`В плане на ${dRu(c.date)}, в выписках ${esc(c.account)} по ${dRu(c.cov)} платежа нет. Считаю, что ещё уйдёт.`;
   return op(`${esc(c.name)} · ${fmt(c.gbp)}`,text,(h?act("tx",c.item,`Это оно: ${natv(h.amt,h.cur)} · ${dRu(h.d)}`):"")+act("paid",c.item,inn?"Получено":"Оплачено")+open(c.item,"Перенести на…","date")+act("skip",c.item,inn?"Не придёт":"Не платим"),Ed.under(c.item,"need"));}
  if(c.n===9)return op(`Без даты и не в расчёте: ${count(c.count,"строка","строки","строк")} на ${fmt(c.gbp)}`,"",`<button class="sm" data-td-flip="undated" aria-expanded="${st.undated}">${st.undated?"Свернуть":"Поставить даты"}</button>`,
   st.undated?c.items.map(id=>by[id]).filter(Boolean).map(it=>`<div class="td-sub"><div class="td-row" data-ed-open="${esc(it.id)}" data-ed-at="need" data-ed-focus="date" role="button" tabindex="0"><span><span class="td-nm">${esc(it.name||"(без названия)")}</span><span class="td-meta">${esc(it.bank)}</span></span><span class="td-am">${Ed.sum(it)}</span></div>${Ed.under(it.id,"need")}</div>`).join(""):"");
  if(c.n===10){const usual=r=>`обычно ${approx(r.usual)} около ${r.day}-го`,line=r=>r.type==="stopped"?`<div class="td-sub"><div><b>${esc(r.label)}</b>: ${r.dir>0?"два платежа подряд не пришли":"два месяца подряд не платили"}. <span class="td-meta">Обычно ${approx(r.usual)}; в прогнозе больше не считаю.</span></div><div class="row"><button class="sm" data-ed-do="seen" data-ed-sk="${esc(r.sk)}" data-ed-ym="${r.ym}">Понятно</button></div></div>`
    :`<div class="td-sub"><div><b>${esc(r.label)}</b> · ${usual(r)} · на ${r.days} дн. позже обычного, ${r.dir>0||!M.cautious?"из расчёта убран":"в осторожной линии ещё считаю"}.</div><div class="row">${open(r.item,"Жду до…","date")}${act("skip",r.item,"В этом месяце не будет")}${act("stop",r.item,"Больше не ждём")}</div>${Ed.under(r.item,"need")}</div>`;

 function need(){
  const C=M.cards,shown=st.more?C:C.slice(0,5),fine=!M.accounts.some(a=>a.stale||a.handOld);

 // ---- the days ----
 // What last month's averages still had left is counted today, in one sum, while a balance or a statement stops
 // short of that month's end (the engine's `lump`). It is in «останется» and in no row, so it is said in words —
 // here and under the statement of «Касса» — or today's figures do not add up for whoever reads them.
 function tail(M){let i=0,o=0,ym="",thr="";Object.keys(M.avg).forEach(k=>{const l=M.avg[k].lump;if(!l)return;ym=l.ym;thr=l.through;if(k==="rev")i+=l.left;else o+=l.left;});
  if(!ym)return "";
  return `Сегодня посчитан и хвост ${MONGF[+ym.slice(5)-1]}, в среднем: ${[i?"+"+fmt(i):"",o?"−"+fmt(o):""].filter(Boolean).join(" и ")} — ${thr?`выписки и остатки только по ${dRu(thr)}`:"выписок за него ещё нет"}.`;}
 const rowH=(it,at)=>{const done=it.state==="done",meta=[it.bank,it.kind==="typed"&&it.cur!=="GBP"?natv(it.amt*(it.vat?1.2:1),it.cur):"",Ed.remark(it)].filter(Boolean).join(" · ");
  return `<div class="td-row${done?" td-done":it.kind!=="typed"?" td-hist":""}" data-ed-open="${esc(it.id)}"${at?` data-ed-at="${at}"`:""} role="button" tabindex="0"><span><span class="td-nm">${esc(it.name||"(без названия)")}</span><span class="td-meta">${esc(meta)}</span></span><span class="td-am"${done?"":` data-live="it.${esc(it.id)}" data-v="${num(it.cash)}"`}>${Ed.sum(it)}</span></div>${Ed.under(it.id,at||"")}`;};
 const sortRows=l=>l.sort((a,b)=>(b.dir-a.dir)||Math.abs(b.cash||b.full)-Math.abs(a.cash||a.full));
 function days(){
  const T=M.T,H=M.H,to=st.all?M.end:dAdd(T,13),blocks=[];let n=0,said=false;
  M.days.forEach(D=>{if(D.d>to)return;const live=D.items.map(id=>by[id]).filter(Boolean),done=(M.doneDays[D.d]||[]).map(id=>by[id]).filter(Boolean);if(!live.length&&!done.length)return;n+=live.length;
   const i=round2(D.in-D.dripIn),o=round2(D.out-D.dripOut);
   // Today's figure also carries what last month's averages still had left; said here, under the figure it explains.
   const tl=D.d===T?tail(M):"";if(tl)said=true;
   blocks.push(`<div class="td-day"><b>${D.d===T?"сегодня, ":""}${dRuW(D.d)}</b><span class="td-dayf">${i?lv(`day.${D.d}.in`,i,"+"+fmt(i))+" · ":""}${o?lv(`day.${D.d}.out`,o,"−"+fmt(o))+" · ":""}${M.v0?"от сегодняшнего: ":"останется "}${lv(`day.${D.d}.e`,D.e,(M.v0&&D.e>0?"+":"")+fmt(D.e))}</span></div>${tl?`<p class="note td-tail">${tl}</p>`:""}${sortRows(live).map(it=>rowH(it)).join("")}${sortRows(done).map(it=>rowH(it)).join("")}`);});
  // What was closed on a day gone by stays under that day, a month back. It is one line until somebody wants it:
  // a month of paid rows above today would bury today.
  const past=Object.keys(M.doneDays).filter(d=>d<T).sort(),pn=past.reduce((a,d)=>a+M.doneDays[d].length,0);
  const before=pn?`<div class="td-day"><b>${st.past?"Закрыто за месяц":`Закрыто за месяц: ${count(pn,"строка","строки","строк")}`}</b><button class="sm ghost" data-td-flip="past" aria-expanded="${st.past}">${st.past?"Свернуть":"Показать"}</button></div>${st.past?past.map(d=>`<div class="td-day"><b>${dRuW(d)}</b></div>${sortRows(M.doneDays[d].map(id=>by[id]).filter(Boolean)).map(it=>rowH(it)).join("")}`).join(""):""}`:"";
  const m=M.avg,ym=T.slice(0,7),per=k=>(m[k].months[ym]||{}).perDay||0,dIn=per("rev"),dOut=Object.keys(m).filter(k=>k!=="rev").reduce((a,k)=>a+per(k),0);
  return `<section class="card"><h2>${st.all?`Все ${H} дней`:"Ближайшие 14 дней"}<span class="note">серым и с «≈» — по истории · нажмите на строку, чтобы поправить</span></h2>
   <div class="td-days">${before}${blocks.join("")||'<p class="note" style="margin:8px 0 0">В эти дни строк нет.</p>'}</div>
   <div class="td-foot"><span class="note">${dIn||dOut?`Плюс ровным слоем, в среднем: ${[dIn?lv("drip.in",dIn,"+"+fmt(dIn)):"",dOut?lv("drip.out",dOut,"−"+fmt(dOut)):""].filter(Boolean).join(" и ")} в день.`:""}${said?"":" "+tail(M)}</span><button class="sm ghost" data-td-flip="all" aria-expanded="${st.all}">${st.all?"Только 14 дней":`Показать все ${H} дней`}</button></div></section>`;
 }

 // ---- the running month ----
 function month(){
  const B=M.month.blocks,name=MONF[+M.month.ym.slice(5)-1],top=Math.max(1,...BL.filter(x=>x[0]!=="result").map(([k])=>Math.max(Math.abs(B[k].total),Math.abs(B[k].usual)))),w=v=>Math.max(0,v)/top*100;
  const cell=(k,f)=>`<td class="m r${f==="usual"?" td-us":""}" data-live="m.${k}.${f}" data-v="${num(B[k][f])}">${fmt(B[k][f])}</td>`;
  const rows=BL.map(([k,label])=>`<tr${k==="result"?' class="td-res"':""}><td>${label}<span class="td-usm">обычно ${fmt(B[k].usual)}</span></td>${cell(k,"fact")}${cell(k,"rest")}${cell(k,"total")}${cell(k,"usual")}</tr>${k==="result"?"":`<tr class="td-bar"><td colspan="5"><span class="td-split" title="факт · в плане · по истории"><i style="width:${w(B[k].fact)}%"></i><i class="td-t" style="width:${w(B[k].typed)}%"></i><i class="td-h" style="width:${w(B[k].hist)}%"></i></span></td></tr>`}`).join("");
  return `<section class="card"><h2>${name}: факт и план<span class="note">полоска: факт · в плане · по истории</span></h2>
   <div class="tbl"><table class="td-month"><thead><tr><th></th><th class="r">Факт</th><th class="r"><span class="td-long">Ещё по плану</span><span class="td-short">Ещё</span></th><th class="r"><span class="td-long">Итог месяца</span><span class="td-short">Итог</span></th><th class="r td-us">Обычно</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note" style="margin:12px 0 0">${M.month.through?`Факт — по выпискам до ${dRu(M.month.through)}`:M.month.byWord?"Факт — пока только отмеченное вручную":"Факта в этом месяце ещё нет"}${M.month.inInbox?` · в т.ч. в разборе ${fmt(M.month.inInbox)}`:""}${M.month.byWord&&M.month.through?` · в т.ч. отмечено вручную ${fmt(M.month.byWord)}`:""}.${M.month.before.in||M.month.before.out?` Хвост ${MONGF[+M.month.before.ym.slice(5)-1]}, которого выписки ещё не показали (${[M.month.before.in?"+"+fmt(M.month.before.in):"",M.month.before.out?"−"+fmt(M.month.before.out):""].filter(Boolean).join(" и ")}), в этот месяц не входит.`:""} Выплаты команде часто уходят в первые дни следующего месяца — месяц может выглядеть легче, чем есть. Corporation tax и другие разовые налоги прогноз не видит — впишите их в «Налоги».</p>
   <div class="td-foot"><span></span><button class="sm ghost" data-tabgo="dashboard">Все месяцы</button></div></section>`;
 }

 // ---- the balance by day ----
 // The expected balance over the day's money in and out (dayChart, above) — and, for founders who asked for it in
 // «Настройки», what a cautious month would leave, as a second line. A tap on a day lists that day's rows under
 // the chart.
 function dayInfo(d){
  const D=M.days.find(x=>x.d===d);if(!D)return "";const its=sortRows(D.items.map(id=>by[id]).filter(Boolean));
  return `<div class="td-dayinfo"><div class="td-day"><b>${dRuW(d)}</b><span class="td-dayf">${M.v0?"изменение":"остаток"} ${fmt(D.e)}${M.cautious?` · осторожно ${fmt(D.c)}`:""}</span></div>
   ${its.slice(0,5).map(it=>`<div class="td-row${it.kind!=="typed"?" td-hist":""}"><span><span class="td-nm">${esc(it.name)}</span><span class="td-meta">${esc([it.bank,Ed.remark(it)].filter(Boolean).join(" · "))}</span></span><span class="td-am">${Ed.sum(it)}</span></div>`).join("")||'<p class="note" style="margin:6px 0 0">В этот день строк нет — только то, что идёт ровным слоем.</p>'}
   ${its.length>5?`<p class="note" style="margin:6px 0 0">ещё ${its.length-5}</p>`:""}<div class="td-foot"><span></span><div class="row"><button class="sm ghost" data-td-day="">Скрыть</button><button class="sm" data-td-days="${d}">Открыть день</button></div></div></div>`;
 }
 function chart(){

  chartW=dayChart(svg,M.days,{start:M.v0?0:M.now,cush:M.v0?0:M.cushion,rel:M.v0,low:M.LOWDAY,two:M.cautious,attr:"data-td-i",pick:d=>{st.day=d;root.querySelector("#td-dayinfo").innerHTML=dayInfo(d);}});
 }
 function chartCard(){
  const H=M.H,two=M.cautious,what=M.v0?"Изменение кассы":"Остаток";
  return `<section class="card"><h2>${what} по дням<span class="note">через ${H} дней: ${lv("end",M.END,(M.v0&&M.END>0?"+":"")+fmt(M.END))}${M.v0||!two?"":` · осторожно ${lv("endc",M.END_C,fmt(M.END_C))}`}</span></h2>
   <div class="legend"><span><i class="td-line"></i>${two?"ожидаем":M.v0?"изменение":"остаток"}</span>${two?'<span><i class="td-line td-c"></i>осторожно</span>':""}${M.v0?"":`<span><i class="td-line td-q"></i>запас ${fmtK(M.cushion)}</span>`}<span><i class="sw" style="background:var(--s1)"></i>придёт</span><span><i class="sw" style="background:var(--s2)"></i>уйдёт</span><span><i class="sw td-hollow"></i>по истории</span></div>

 function render(){

  M=Plan.model();by={};M.items.forEach(it=>{by[it.id]=it;});Ed.use(M);
  const T=M.T,H=M.H,ref=acc(M.nowAcct),sub=[dRuW(T),M.v0?"остатки вписаны не все":M.nowDate?`выписки и остатки по ${dRu(M.nowDate)}${ref?` (${ref.name})`:""}`:"остатки не вписаны"];

   <div class="row"><span role="group" aria-label="На сколько дней вперёд" class="row">${[30,60].map(h=>`<button class="chip${H===h?" active":""}" data-td-h="${h}" aria-pressed="${H===h}">${h} дней</button>`).join("")}</span><button class="primary" data-ed-add>Добавить</button></div></div>`;

   :head+Ed.sheet("add")+verdict()+kpis(M)+Ed.sheet("bal")+accounts()+`<div class="td-two">${chartCard()}${need()}</div><div class="two">${days()}${month()}</div>`;

 }
 // Only the chart depends on the width; redrawing the whole tab on a resize would take the keyboard away on a
