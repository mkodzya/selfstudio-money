// =====================================================================================================================
// LIVE — the forecast engine (begin)
//
// One pure function, Live.compute(ledger document, plan document, T, opts) → model. «Сегодня» and «Касса»
// draw what it returns and work nothing out themselves, so two tabs cannot disagree about a figure. It reads its four
// arguments, the page's constants (FOUNDERS, CURS, GENERIC, FX0) and two pure helpers (norm, owner). It never looks at
// S, the DOM, storage or the clock: "today" is the argument T, the rates are the ledger document's own. Days are
// counted from a date's digits in UTC. So the same two documents and T give the same JSON in any browser and any
// time zone, and nothing it is handed is changed.
//
// THE FORECAST IS WHAT THE FOUNDERS WROTE. Nothing is filled in from history: no «≈ по истории» rows, no averages,
// no cautious line. A line of the plan is one of three things — a row somebody wrote; a month of a row marked
// «каждый месяц»; a tax of the studio worked out by a rule. The ledger is read for what it is good at: closing a
// written line when its payment is filed, saying which client carries VAT, the taxes' and the month's facts, and
// the list the helper «Подставить по прошлым месяцам» offers — which a founder ticks by hand.
//
// ENTRY POINTS
//  Live.compute(ledger, plan, T, opts) → model     the engine
//  Live.upgrade(plan, ledger, T) → plan             a v1 or v2 plan as v3; a v3 one in shape. Pure: a copy comes back.
//                                                   The ledger and T are read only for a v2 plan (see THE UPGRADE)
//  Live.blank(ids) → plan                           a new v3 plan: five accounts (ids[0..4]) and the two tax rules
//  Live.today() → "YYYY-MM-DD"                      the date in London, read from the clock on every call
//  Live.day(ms) → "YYYY-MM-DD"                      the date in London of a stored moment (a row's c0, a balance's at)
//  Live.passed(model, accountKey, asOf) → [{id, tick:false, on}]   the list for «Что из этого уже прошло?» (below)
//  Live.vatFor(model, key, bank) → boolean          the «+ VAT» a new inflow starts with; key is norm(alias(name))
//  Live.write.<verb>(plan, …)                       the hands that change a plan — see WHAT A TAP WRITES
//  Live.LISTS, Live.perName(periodKey)              the five lists in order; "2026Q3" → «III кв. 2026»
//  window.__money = {compute, upgrade, passed, vatFor, write, model(opts), today, by}   the same, for the checks;
//                                                   model() is compute on what the page holds now, today a getter
//
// ARGUMENTS
//  ledger  what GET /api/founder/money stores: {tx, inbox, rules, fx, aliases, history}. Rows with s:"demo" are left
//          out of everything. r.at is when a row was uploaded (ms; read as 0 when absent): a statement row closes a
//          written line only if it was uploaded AFTER the line was written, and only statements uploaded after a hand
//          mark can say the bank shows no such payment. A row in a currency the page has no rate for is read as pounds.
//  plan    what GET /api/founder/money/cash stores. An older document is upgraded on the way in (Live.upgrade).
//  T       today, "YYYY-MM-DD".
//  opts    {H}: the horizon in days, 30 or 60 (default 60). The window W is T … T+H, both ends included. H changes the
//          days, IN, OUT, END and LOW — never «Можно вывести», the taxes or the cards.
//
// THE PLAN DOCUMENT, v3 (`fx`, `horizon`, banks[].on, `ser`, `tails`, `vat`, `cautious` and a row's `sure`, `extra`,
// `inv`, `src`, `cyc`, `offAt` are no longer read, and the upgrade drops the last ten)
//  cushion                         number, default 5000
//  fresh                           {on:boolean, days:1..90} — «Не называть сумму вывода, если остатки старше … дней».
//                                  Absent: on, 8 days. Off: «Можно вывести» always names a sum, with the balances' day
//  banks[]                         {id, name, bank, cur, amt} + asOf:"YYYY-MM-DD", at:ms, by — the day and moment the
//                                  balance was typed; legacy:true — a v1 balance, which is no anchor, only a figure
//                                  to offer when the founder types the real one
//  inflows|team|taxes|other|div[]  the five lists. `div` is «Дивиденды»: withdrawals and founders' personal taxes.
//    id, name, amt, cur, bank, date, on, fixed, tag, info      as typed; amt is before VAT, in cur
//    c0:ms          written (0 for rows that came from v1)           m:{t:ms,by}   last human edit
//    blk            rev|cogs|fixed|other|behalf|tax|div; by list when absent
//    sk, skBy       link to a label of the table ("rev|client a"), stored only when a founder chose it ("hand");
//                   otherwise the link is found again on every compute (LINKS)
//    mon:"YYYY-MM"  the month an undated row belongs to (the month of T when absent)
//    paid           {on:"YYYY-MM-DD", at:ms, by, amt?, ok?, legacy?} — a hand mark: «Оплачено» / «Получено». With
//                   amt it is «Частично»: so much was paid (in cur, the tax on top included) and the line is closed
//                   at that; the rest was written as a row of its own (carry). `true` (an old tab) reads as legacy
//    carry:{ym}     what is left of a line of the month `ym` that was paid in part, written by «Частично»: a one-off
//                   row on the day the founder named for the rest. With that date it is counted like any dated row —
//                   but it is never «the month's own row» of its label, and a payment that fits both it and that row
//                   goes to the nearer date. Without a date — as «Частично» wrote it before the founder named the
//                   day (then in the month after `ym`), or once its date is emptied — it is a row of `mon`: what
//                   the studio OWES is counted on the first day of that month (today, once it has begun), and what
//                   is owed TO the studio nowhere
//    tx[], notx[]   ledger row ids a founder said are / are not this row's payment        closed  «это всё»
//    vat            inflows only, a boolean stored when the row is saved: its invoice carries the tax on top. Its
//                   cash is amt × (1 + the rates of the on-top rules / 100) — 1.2 with UK VAT — whether those rules
//                   are switched on or not: a rule that is off is not worked out, the client pays it all the same
//    rec            «каждый месяц»: {day:1..31, from:"YYYY-MM", to?:"YYYY-MM", chain?:<row id>, x?:{[ym]:{…}}}.
//                   The row is then the template of its months, from..to (endless without `to`), on day
//                   min(day, days in the month); it has no line of its own. x[ym] is what a founder did to ONE
//                   month: {amt?, date?, off?:true, paid?, tx?, notx?, closed?}. chain names the row a
//                   split continues: the rows of one chain are one payment through time
//    of             taxes only: {r:<rule id>, p:<period key>} this row IS that period's whole bill · {…, part:true}
//                   an instalment of it · false a bill of its own. No `of` key at all = a row from before v3,
//                   read by its name (T11)
//    ptax, f        div only: a founder's personal tax; whose ("mika"|"misha"|"vanya"), when the name says.
//                   A div row without ptax is a withdrawal
//  tax                             the studio's taxes, by rules
//    since:"YYYY-MM-DD"            the day this plan became v3 — the day the page began to answer for the built-in
//                                  rules. The page stamps it once (Cash); read as T while absent
//    rules[]                       {id, name, base:"ontop"|"share", rate:<percent>, acct?:"Bank|CUR", per:"m"|"q"|"y",
//                                  day:1..31, off:1..12, on, ask?, away?, from:"YYYY-MM-DD", pay?:"Bank|CUR",
//                                  builtin?, by, at}. ontop — on top of the invoices of clients who carry it; share —
//                                  a share of the receipts on `acct`. Due on `day` of the month `off` months after the
//                                  period's last. ask — nobody has confirmed it: it shows its accrual and counts
//                                  nowhere. away — paid not from the studio's accounts: likewise. from — the first
//                                  due date it answers for (since, when absent). pay — the account it is paid from.
//                                  Built in: {id:"vat", "UK VAT", ontop, 20, q, day 7, off 2} and {id:"usn", «УСН по
//                                  Точке», share, 6, acct "Tochka|RUB", q, day 28, off 1, ask:true}
//    cl{[key]}                     "vat" | "no" — a founder's own mark for a client; key is norm(alias(name))
//    per{["<rule>|<period>"]}      a founder's answers about one period: {amt? «Сумма по декларации», date? moved to,
//                                  none? «не платим», closed?, paid?:{on,at,by,ok?}, tx?[], notx?[], m:{t,by}}.
//                                  Period keys: "2026-10", "2026Q4", "2026"
//
// THE UPGRADE (Live.upgrade; the page runs it once, after both documents are loaded, and saves)
//  v1 → v2 as before: ids that last (worked out from each row, not random), balances legacy, c0 0, «оплачено» a
//  founder's word with no date. v2 → v3: every stored row survives, with its date, mark and links, except a forecast
//  row (h|sk|ym) that only said «в этом месяце не будет» (on:false) or whose month was already covered — those are
//  dropped. A forecast row a founder confirmed keeps its amount; one that was only moved or marked (sure:false)
//  takes what deliverable A counted for it on the day of the upgrade — the stored sum less what was typed beside it
//  and what had come (the function `counted`, which keeps A's own reckoning of those two sums and nothing else of
//  A); worth nothing, it is dropped. plan.ser[sk].made becomes `rec` on the row it was ticked on — the row that
//  carries the series' key, else the earliest of its name — or on a row made from it, id "rec|"+hash(sk); the months
//  of it a founder had touched become rec.x, and a later month that holds a row of the same name of its own is
//  switched off in it (unless that row was «сверх обычного»). Rows of «Прочие расходы» with
//  a founder for a block, and tax rows with a founder in their name, move to `div`. A tax row with sk
//  "tax|vat|YYYYQn" gets of:{r:"vat",p}. Every inflow gets vat:true|false as it stood. tax = the two built-in rules
//  (UK VAT off if plan.vat.on was false). ser, tails, vat, cautious go.
//
// WHAT A TAP WRITES (Live.write — each changes the plan it is handed, in place, and nothing else; `it` is an item of
// the model the tap was made on, `c` a card of it; now and by come as arguments. The engine itself never writes)
//  add(P, list, row)               a new row. A tax with a founder in its name goes to `div` as ptax; an inflow gets
//                                  vat as a boolean; a tax row gets of:false unless told otherwise. Returns the list
//  mark(P, it, on, at, by)         «Оплачено» / «Получено»: paid:{on,at,by} — on the row, in rec.x[ym] for a month of
//                                  a repeating row, in tax.per[key] for a computed tax. unmark removes it
//  partial(P, it, got, id, now, by, on, date)   «Частично»: paid:{on,at,by,amt:got} on the line, and the rest as a
//                                  new row (id) dated `date`, the day the founder named — «{name} — остаток с
//                                  {октября}», carry:{ym}, no mon, the same list, link and VAT; a one-off row even
//                                  when it came from a month of a repeating one. On a row that is itself such a rest
//                                  the new one keeps its name and its carry.ym. Without `date` (a caller from
//                                  before) the row has no date and mon = the NEXT month. Not for a computed tax.
//                                  Returns the new row (null if nothing is left)
//  off(P, it) / on(P, it)          the tick: row.on=false · x[ym].off for one month · per.none («не платим») for a tax
//  tx(P, it, id) / notx / closed   «Это оно» / «Нет, другой» / «Это всё» — on the row or x[ym]
//  link(P, it, sk)                 «{label} в таблице — это «{name}»? Да»: the row's link, by hand
//  set(P, it, v, now, by)          a change to one line; v holds only what changed. A row: its fields (an emptied
//                                  date keeps the row in v.mon; a row of `taxes` renamed after a founder moves to
//                                  `div` as ptax, like a new one). A month of a repeating row — «Только {октябрь}»:
//                                  amt and date go into x[ym] (and leave it when they are the row's own again); name,
//                                  cur, bank and vat cannot differ for one month and change the row. A computed tax:
//                                  amt → per.amt, date → per.date. v.of on a row of `taxes` is «К чему относится»
//  del(P, it)                      a row is removed; a month of a repeating row is switched off; a tax is «не платим»
//  tick(P, it)                     «каждый месяц» on a row: rec:{day, from} from its date; a mark or a link it had
//                                  moves to x[from]; and x[ym].off for every later month that already holds a row of
//                                  the same label (it.twins) — that month would be counted twice
//  untick(P, it) / resume(P, it)   the tick taken off a month: rec.to = that month · «Вернуть»: rec.to removed
//  onward(P, it, v, id, now, by)   «{Октябрь} и дальше»: on the row's first month the row itself changes; later the
//                                  row is split — the old one gets to = the month before, a copy with id `id`, the
//                                  new values, the same c0, rec.from = this month, rec.chain and the x of this month
//                                  and later takes over. v: {name, amt, cur, bank, vat, date}; a date is the new day
//  same(P, it, id, now, by)        «И дальше так же» on a month paid at another sum: onward from the NEXT month at
//                                  what came (it.done.got without the tax on top)
//  end(P, it) / stop(P, it)        «…и дальше» of a delete or of «Не придёт»: rec.to = the month before (the row goes
//                                  if this was its first) · card 10's «Больше не повторять»: rec.to = this month, off
//  helper(P, lines, ids, now, by)  the helper's ticked lines (model.helper.lines[i], amt/day/start as edited) become
//                                  rows with rec:{day, from:start}, sk by hand, vat for an inflow, ptax+f in `div`
//                                  for a personal tax, and x[ym].off for each month ≥ start in line.rows
//  client(P, M, key, mark)         a founder's mark for a client: "vat" | "no" → tax.cl[key], and vat on every row of
//                                  M.clients[].rows that differs; null → the mark removed. Returns rows changed
//  pay(P, key, id, whole, now, by) T9 / card 12: per.tx += id; whole → per.closed; either removes per.paid.
//                                  nopay(P, [keys], id, now, by): per.notx += id on each («Другой налог»)
//  parts(P, c, id, now, by)        card 14 «Да, частями как раньше»: per.tx = c.rows, and a taxes row (id) named
//                                  «{налог} за {период} — часть», amt c.parts.amt, of:{r,p,part:true}, rec:{day,
//                                  from, to} and x[to].amt = c.parts.last. lump(P, c, T, now, by) «Да, одной суммой»:
//                                  per.tx = c.rows, per.date = T. shut(P, c, now, by) «Нет, закрыто»: per.closed
//  rule(P, id, v, now, by)         a rule's own fields; a key given as null is removed ({ask:null} confirms it,
//                                  {away:true, ask:null} is «Не со счетов студии»). ruleAdd(P, rule) / ruleDel(P, id):
//                                  «Добавить налог» / «Удалить» (a built-in rule is never deleted; a deleted rule's
//                                  answers in tax.per go with it)
//  Live.fromOf(model rule, ±1)     not a writer: the due date of the period before / after the first one a rule
//                                  answers for — what rule.from becomes on «‹ раньше» / «позже ›»
//  A balance typed: on the banks row amt, asOf, at: now, by; legacy removed (Ed writes it, with the ticked lines
//  marked a moment before: mark(P, it, on, now − 1, by)).
//
// THE RULES, WHERE THE SCREENS NEED THEM
//  LINKS (D2)  inflows / team / other: the name as the table spells it → the longest rule key inside it → the longest
//    label it begins with → the only label with its first word; else unlinked, and it closes by amount. taxes: the
//    studio's tax rows (no owner). div + ptax: tax rows with an owner (that founder's when f is set). A withdrawal
//    is linked to nothing: it is a BUDGET, used up by the rows of the three founders' blocks uploaded after it was
//    written and dated in its window — date −10 … +20 for a one-off, to the day before the next month's window for a
//    month — oldest first, what a row has over passing to the next withdrawal; what is not taken by the end of the
//    window (as the statements of its bank reach it) is dropped. Never late or missed, never in a card.
//  ONE-OFF ROWS (E3)  a row uploaded after the line was written, not more than ten days early, of its label (or its
//    block, for an unlinked line — and never a payment whose own label has ever been a series): 1 within tolerance
//    (in ±2%, min £2; out −2% … +5%; ±6% across currencies) → the oldest such line; 2 the invoice with the tax on
//    top where the row had none ("vat"), or without it where the row had it ("novat"); 3 the sum of 2–6 lines of the
//    label, if only one such set; 4 for a single named line, 0.3–1 of it → a part, 1–1.5 → done, «пришло больше».
//    A whole-bill tax row closes like the bill (0.7–1.3, −31 … +61 days, from the rule's account).
//  MONTHS OF A REPEATING ROW (R7)  paid by the label, whatever the sum — tried after the label's one-off rows. A
//    payment's own month is the one whose date is nearest (not more than ten days ahead; a tie → the earlier); while
//    that month has under (1 − tolerance) of its cash the payment is its, else it catches up the oldest earlier month
//    still open, else adds to its own — unless the next month's window has opened and that month has no line (the
//    repeat ended): then it is nobody's. A month marked paid by hand has first claim on the row that then shows it.
//    Done once it has 0.7 of its cash — shown at the sum that came; under 0.7 the rest stays open until the statements
//    reach date + g, then is dropped (note "part"). The difference is never a debt by itself. A month the table has
//    no name for closes by amount, and from then on the chain knows who pays it (item.payer).
//  «ОПЛАЧЕНО» MEANS PAID; «ЧАСТИЧНО» IS ITS OWN ANSWER (the founder's decisions of 7 October)  A hand mark closes its
//    line for good. It stands in for the payment — and is counted in «сейчас» — until statements uploaded after it
//    reach its day; then the payment that shows takes its place whatever its sum («заплатили £5,400, в плане
//    £6,000»), and with none the line stays closed on the founder's word (done.by "ok"). Nothing is owed again by
//    itself: no "unseen" state, no card. A debt remains only where a founder says «Частично» (paid.amt): the line
//    is closed at what was paid, takes no payment beyond that, and the rest is a row of its own (carry) on the day
//    he names — «пусть лучше не на следующий месяц уходит, а я сам выбираю дату оплаты остатка, как при переносе».
//    On that day it is a dated one-off row like any other: an inflow is expected and an outflow planned on it, a
//    payment that fits it closes it, and past its day it is asked about in «Нужно решить». Two rules are its own.
//    A payment that is exactly what its own month of the same label still lacks goes to whichever of the two is
//    dated nearer to the payment — a tie to the month. And it is never «the month's own row» of its label: the
//    tick «каждый месяц» and the helper do not see it (R1, C7).
//    A rest carried with NO date — as it was written before the day became the founder's to name, or once its
//    date is emptied — stays as it was: what the studio owes is counted on the first day of its month (state
//    `carry`), what is owed to it nowhere, and a payment that is exactly its own month's is never its.
//  STATES (F1, R6)  measured at the day the statements of the line's bank reach (cov), never at today: due · blind
//    (past, cov short of its date) · waiting (past by ≤ g) · late (inflow: step 1 still counted today, step 2 from
//    2g out of the line; outflow: counted today, never dropped) · undated · done · off · empty · carry (an undated
//    debt the studio owes, carried from a month paid in part: counted on the first day of its month, or today), and
//    doubt — a later month of an inflow chain whose latest past-grace month is late, got nothing and nobody answered
//      (not moved, not off, not marked): in no figure. "Later" is by the month a line was made for.
//    missed — a late month of an outflow chain that got nothing, with no moved date, once the statements
//      reach the next month's window (next date − 10): in no figure, card 10.
//    g is the series' own (5..14 days) for a line linked to a label that has been regular, else 10.
//  TAXES (T)  accrued from facts: UK VAT = the VAT the ledger's revenue rows carry; another on-top rule = its share
//    of those invoices; a share rule = rate × receipts on its account, in its currency. From the plan: every written
//    inflow, on the day it is counted (a marked one: the day of its mark), by the same two formulas. A period owes
//    its whole-bill row, else per.amt, else facts + plan to its last day; less its part rows and the payments a
//    founder named. It is closed by exactly one of: per.none · a mark · per.closed · its whole-bill row done ·
//    a whole payment (0.7–1.3 of what is left, from the tax's account, −31 … +61 days of its date, while no older
//    period of the rule has anything left or is asked) · parts reaching 0.85. Any other payment of a tenth of it or
//    more is asked about (card 12); under a tenth it is another tax. One period back from rule.from is looked at
//    once: paid (found ≥ 0.85) → in no figure; else asked (card 14), its remainder in the reserve until answered.
//    A marked period is paid: while the mark stands in for the payment its state is `paid` by "mark"; once the
//    statements have gone past its day, the payment they show — uploaded after the mark, in the period's own
//    window — takes its place whatever its size (by "row"), and with none the period stays closed on the
//    founder's word (`word`).
//  THE RESERVE, «МОЖНО ВЫВЕСТИ» (T8, F5)  res = what of the balance belongs to taxes on a day: for every open period,
//    accrued by that day − paid towards it − what its lines have already taken out of the balance. f = e − res.
//    free(d) = max(0, min f over d … d+60 − cushion), on a walk to T+120 whatever H is; today's also takes F0 — today
//    without the money that is counted on today and has not come. A step is a later day whose free is at least
//    max(£500, 10%) above the last shown. While «Разбор» holds unrecognised receipts, f is also less the money the
//    plan has brought in by that day, up to their sum: a receipt already in the bank may be a line still awaited.
//    The thin-plan slices count the team and other costs written for their days — those already paid at what was paid.

// THE MODEL (money is GBP rounded to pence unless a field says "native"; dates are "YYYY-MM-DD", months "YYYY-MM")

//                                  row at all, never past T — the months before the month of `reach` are whole
//  v0                              true while an active account has no balance: `now`, `free` and taxes.reserve are
//                                  null and the line starts at 0

//  accounts[]                      one per plan.banks row, plus one for any (bank, currency) that a statement row or an
//                                  open written line names and the plan does not hold yet (inPlan:false)
//    key                           "Wise|GBP" (a second row of the same bank and currency: "Wise|GBP|<row id>")
//    id, bank, cur, name, title    plan row id (null if not in the plan); name is "Wise GBP", title the row's own name
//    inPlan, active, material      active: its bank has a ledger row in the last 60 days or an open written line
//                                  names it. material: active and worth ≥ 10% of now, or has an open line within 14 days

//    legacy, old                   a v1 balance waiting to be confirmed, and its amount (native) to pre-fill
//    after, marks, est             native: statement rows dated after asOf; hand marks counted; anchor+after+marks
//    same                          native, ≤ 0: the part of `after` that is payments OUT dated on the balance's own
//                                  day and uploaded after it was typed «на сейчас» — taken to have left after it
//    gbp                           est in GBP (null without an anchor)
//    cov, through, age             statements reach `cov` (later of sheetEnd and the bank's newest row, never past T);
//                                  through = later of asOf and cov; age = T − through in days (null if unknown)
//    stale                         "" | "ask" (9–15 days without a statement) | "old" (16+); material accounts only
//    handDays, handOld             days since the balance was typed; true when that is over 30 (material only)

//    payer                         for a month of an unlinked chain that an amount closed: {sk, label, id} — whom to

//                                  some of its receipts are sheet rows, converted at today's rate

// WHAT THE DESIGN LEFT OPEN, AND WHERE ITS LETTER WAS NOT KEPT
//  · «под налоги сейчас» (taxes.reserve) is the reserve from facts and from lines marked received — the design's
//    RES[T−1] plus what a mark made today accrues: that money is in «сейчас» already.
//  · A marked month of a repeating row keeps first claim on the row uploaded after the mark and dated on.−3 … +7,
//    as a marked forecast had: «Оплачено» is one press, and a payment three weeks early otherwise paid last month twice.
//  · `doubt` is "later by the month the line was made for", not by date: a month a founder moved to a later day has
//    been answered and stays in the line (the design's own test 7).
//  · Card 15 is not raised for a rule that taxes nothing yet — no receipt on its account in the ledger or the plan.
//  · The on-top factor counts every on-top rule, on or off (the design's letter says "that are on"): «Считать» off
//    stops a tax being worked out, not the client paying it — so a row with «+ VAT» keeps its cash through the
//    upgrade of a plan that had «Считать VAT» off, as the design's own §5.30 asks.
//  · Which bank's statements retire a mark on a VAT period: the bank its line stands on (the last payment's).
//  · A tax row in `taxes` with a founder in its name is read as a personal tax wherever it is stored.
//  · A hint is not raised for a month of a repeating row by a payment more than fifteen days from its date: that
//    is another month's. For a one-off row the first iteration's rule stands (not another cycle of a regular label).
//  · The months occurrences are generated for end with the month of T+120; «Ещё по плану» of a period that runs
//    past it holds what is generated.
//  · The six months «обычно» is the median of are the six before the month the ledger reaches, so nothing moves at
//    midnight on the 1st. A line paid on a founder's word is the month's fact; a line dated in an earlier month that
//    no statement has reached is in no `rest` (month.before).
//  · A hand mark is replaced by a statement row uploaded after it, or by one that sat in «Разбор» with no block and
//    no name; it lasts until statements uploaded AFTER it reach its day.
//  · The founder's decision of 7 October («оплачено — значит оплачено», «частично» as its own answer) outranks the
//    design's R7.4, E6 and T9: `keep`, `unseen`, «Всё верно» and the cards that asked about a mark are gone. A
//    stored paid.ok is still read, as the same closing on a founder's word.
//  · His second word of that day replaced the end of the first: what is left after «Частично» no longer goes to
//    the next month without a date — the founder names its day in the same question («я сам выбираю дату оплаты
//    остатка, как при переносе»). Nothing stored is rewritten for it: a rest carried without a date is read as
//    before, and the plan document is still version 3.
//  · «Как в прошлый раз» in the helper is the latest cycle that holds as many payments as the label usually makes,
//    due or not: a payment made on its day is "last time" at once, not a month later.
//  · No «≈» is shown on «Сегодня» or «Касса»: the tabs show nothing that is a guess, and a tax worked out by a rule
//    is told apart by muted ink and the words «посчитано по правилу» (the look the founder approved on 7 October).
//  · The balance's own day. The question «were these rows already in the balance you typed?» is not asked yet
//    (the second deliverable). Until it is, the cautious half of the first design's B4 holds: of the rows dated on
//    the day a balance was typed «на сейчас» and uploaded after it, payments OUT are taken to have left after the
//    balance (account.same), money IN to be inside it. A payment made that morning, before the figure was read off
//    the bank, is so taken off twice until the next balance is typed — «Счета» says which sum that is.
//  · The helper starts no line a month later because its day has passed (the design's C7.4 did, where the balance
//    was typed for that day or later): such a line starts this month and is flagged `gap`, and the sentence names
//    it among the rows «между выписками и вписанным остатком». Left out, the largest unpaid lines of the first
//    month were missing from the plan without a word.
//  · vi is the verdict only where the unsorted receipts could change it; and while any are unsorted «Можно вывести»
//    holds back as much of the expected money as they could be (free.tight.inbox) — the design named a sum that
//    counted the receipt in the bank and the line it may have paid.
//  · «Разбор» files a receipt with the VAT a founder's mark for the client says (vatOf, outside this block); the
//    design left «Разбор» to its bank's habit for this iteration, which left VAT collected and not reserved.
//  · A part row of a period whose whole bill a founder typed adds to that bill (the design's §5.25 wants it taken
//    out of it): the screens do not offer «Часть…» for such a period, so the two do not meet by a founder's hand.

const Live=(()=>{
 const LISTS=["inflows","team","taxes","other","div"],OLD=["inflows","team","taxes","other"];
 const BLK0={inflows:"rev",team:"cogs",taxes:"tax",other:"other",div:"div"},GRP={inflows:"rev",team:"team",taxes:"tax",other:"other",div:"div"};

 const KEYS=["rev","cogs","fixed","other","behalf","tax"].concat(FOUNDERS),ROWS=["rev","team","other","tax","div"];

// The plan document lives inside Cash, which loads it and saves it under its own revision. This is the one door to
// it. doc() is the document; model() the forecast worked out from it and the ledger, for today; edit(label, fn) one

// of the editing cards below opens or closes. «Касса» is such a tab like «Сегодня»; the one thing it does past this
// door is a keystroke in a row of a month, which it writes and saves itself so as not to be redrawn under the

 function fields(v,o){
  const box=(k,on,label,note)=>`<label class="ed-chk"><input type="checkbox" data-ed-f="${k}"${on?" checked":""}><span>${label}${note!==undefined?` <span class="note" data-ed-n="${k}">${esc(note)}</span>`:""}</span></label>`;

   <label class="fld" for="ed-amt"><span>${o.amtLabel||"Сумма"}</span><input id="ed-amt" data-ed-f="amt" type="number" min="0" step="any" inputmode="decimal" value="${esc(v.amt)}"></label>
   <label class="fld" for="ed-cur"><span>Валюта</span><select id="ed-cur" data-ed-f="cur"${o.lockCur?" disabled":""}>${opt(CURS.map(c=>[c,c]),v.cur)}</select></label>
   <label class="fld" for="ed-bank"><span>Банк</span><select id="ed-bank" data-ed-f="bank"${o.lockBank?" disabled":""}>${opt(BANKS.map(b=>[b,b]),v.bank)}</select></label>
   <div class="fld ed-wide"><label class="lbl" for="ed-date">Дата</label><div class="ed-mv"><button type="button" data-ed-shift="-1" title="На день раньше" aria-label="На день раньше">‹</button><input id="ed-date" data-ed-f="date" type="date" max="${dAdd(Live.today(),731)}" value="${esc(v.date)}"><button type="button" data-ed-shift="1" title="На день позже" aria-label="На день позже">›</button></div></div>
   ${o.of!==undefined?ofSelect(o.of):""}
  </div>${o.lockName?"":`<datalist id="ed-names">${names(o.list).map(x=>`<option value="${esc(x.l)}">`).join("")}</datalist>`}
  ${boxes?`<div class="ed-chks">${boxes}</div>`:""}${o.note?`<span class="note">${o.note}</span>`:""}`;

 function rowCard(it){
  const done=it.state==="done",tax=it.src==="tax",occ=it.src==="occ";
  let body="";
  if(!done){
   const o={list:it.list,lockName:tax,lockCur:tax,lockBank:tax,occ:it.occ};
   if(it.list==="inflows")o.vat=it.vat;
   if(tax)o.amtLabel="Сумма по декларации";
   else{o.monthly=ticked(it);if(occ)o.note=it.occ.last?"название, банк и валюта — для всех месяцев этой строки":`сумма и дата — только для ${monG(it.occ.ym)}, если не нажать «${MONF[+it.occ.ym.slice(5)-1]} и дальше»; название, банк и валюта — для всех месяцев`;}
   if(it.list==="taxes"&&!tax&&!it.ptax)o.of=ofValue(it);
   body=fields({name:it.name,amt:tax?Math.round(it.amt):it.amt,cur:it.cur,bank:it.bank,date:it.date},o);
  }
  const save=done?"":occ?`<span class="row" data-ed-saves>${saves(it,ticked(it))}</span>`:'<button class="sm primary" data-ed-save>Сохранить</button>';
  return `<article class="ed-card" data-ed-card="row" data-ed-id="${esc(it.id)}">${why(it)}${body}${askBox(it)}
   <div class="ed-foot"><div class="row">${actions(it)}</div><div class="row"><button class="sm ghost" data-ed-x>Закрыть</button>${save}</div></div></article>`;
 }
 const miss=(card,k,msg)=>{const f=q(card,`[data-ed-f="${k}"]`);if(f)f.focus();toast(msg);};
 function rowSave(card,mode){
  const it=item(card.dataset.edId);if(!it||Plan.lost())return;
  const f=k=>q(card,`[data-ed-f="${k}"]`),was=it.src==="occ",tick0=ticked(it),tax=it.src==="tax",amt0=tax?Math.round(it.amt):it.amt,of0=f("of")?ofValue(it):"";
  const v={name:f("name").value.trim(),amt:+f("amt").value,cur:f("cur").value,bank:f("bank").value,date:f("date").value,vat:f("vat")?f("vat").checked:it.vat,mon:f("monthly")?f("monthly").checked:tick0,of:f("of")?f("of").value:""};
  if(f("amt").value===""||!(v.amt>=0))return miss(card,"amt","Впишите сумму");
  // A month of a repeating row with no amount is not a month of nothing: the tick says that.
  if(!(v.amt>0)&&forecast(it))return miss(card,"amt",NOZERO);
  if(!okDate(v.date))return miss(card,"date",FARMSG);
  if(!v.date&&(v.mon||forecast(it)))return miss(card,"date",forecast(it)?"У этой строки дата есть всегда":"Чтобы повторять каждый месяц, нужна дата");
  if(f("of")&&v.of==="")return miss(card,"of","Выберите, к чему относится этот налог");
  const ch={name:v.name!==it.name,amt:v.amt!==amt0,cur:v.cur!==it.cur,bank:v.bank!==it.bank,date:v.date!==it.date,vat:v.vat!==it.vat,mon:v.mon!==tick0,of:!!f("of")&&(v.of!==of0||it.of===null)};
  cur=null;if(!Object.values(ch).some(Boolean))return Plan.redraw();
  const onward=was&&mode==="onward"&&v.mon,tw=ch.mon&&v.mon&&!was?twins(it.list,v.name,(v.date||it.date).slice(0,7)):[];
  // The end of a repeat, and its return, are said in the words the constructor uses for them.
  const moved=ch.name&&it.list==="taxes"&&!tax&&!!owner({c:"tax",l:v.name});
  const say=was&&ch.mon?(v.mon?`${v.name||it.name}: повтор продолжается`:`${v.name||it.name}: повтор закончится после ${monG(it.occ.ym)}`)
   :`Сохранено: ${v.name||it.name}${was?(onward?` — с ${monG(it.occ.ym)}`:ch.amt||ch.date?` — только ${mon(it.occ.ym)}`:""):""}${tw.length?" · "+twinWords(tw):""}${moved?" · личный налог — перенесён в «Дивиденды»":""}`;
  if(Plan.edit(say,(P,now,by)=>{if(onward)from(P,it,v,ch,now,by);else apply(P,it,v,ch,now,by);}))toast(say,back);
 }
 // What a change to a row's fields writes. `v` is the row as it should now read, `ch` names the fields that differ
 // (v.mon is «каждый месяц»; left out, it stays as it was). The card's «Сохранить» writes through here, and so does
 // every cell of the monthly constructor — one field at a time, as it is typed. On a month of a «каждый месяц» row
 // a new amount or date is that month's alone (Live.write.set); the tick put on a row makes it repeat from its own
 // month, taken off a month it ends the repeat after that month. Returns the stored row, if there is one.
 function apply(P,it,v,ch,now,by){
  const o={};["name","amt","cur","bank","date","vat"].forEach(k=>{if(ch[k])o[k]=v[k];});
  if(ch.of)o.of=ofStore(v.of);
  if(o.date===""&&it.src==="row")o.mon=it.ym;
  const r=Object.keys(o).length?W.set(P,it,o,now,by):null;
  if(ch.name&&it.src!=="tax")relink(r,it.list);
  if(ch.mon&&v.mon&&it.src==="row"&&(ch.date?v.date:it.date))W.tick(P,{id:it.id,twins:twins(it.list,ch.name?v.name:it.name,(ch.date?v.date:it.date).slice(0,7))});
  if(ch.mon&&!v.mon&&it.src==="occ")W.untick(P,it);
  if(ch.mon&&v.mon&&it.src==="occ")W.resume(P,it);
  return it.src==="tax"?null:r;
 }
 // «{Октябрь} и дальше»: the same change for this month and every month after it — the row itself where this is
 // its first month, a new row that takes over from this month otherwise (Live.write.onward). The past stays as it was.
 function from(P,it,v,ch,now,by){
  const o={};["name","amt","cur","bank","date","vat"].forEach(k=>{if(ch[k])o[k]=v[k];});
  const r=W.onward(P,it,o,uid(),now,by);
  if(r&&ch.of)r.of=ofStore(v.of);
  if(r&&ch.name)relink(r,it.list);
  return r;
 }

 // ---- «Добавить» ----
 function addCard(){
  const d=cur.draft,what=cur.what;
  const chips=`<div class="row" role="group" aria-label="Что добавить">${WHAT.map(([k,n])=>`<button class="chip${what===k?" active":""}" data-ed-what="${k}" aria-pressed="${what===k}">${n}</button>`).join("")}</div>`;
  // «Дивиденды» are of two kinds: money the founders take, and a founder's own tax paid through the studio.
  const kind=what==="div"?`<div class="row" role="group" aria-label="Что именно">${[["wd","Вывод"],["ptax","Личный налог"]].map(([k,n])=>`<button class="chip${cur.kind===k?" active":""}" data-ed-kind="${k}" aria-pressed="${cur.kind===k}">${n}</button>`).join("")}<span class="note">${cur.kind==="ptax"?"личный налог фаундера: страница его не считает, его вписывают строкой":"сколько и когда решили взять — одной строкой на всех"}</span></div>`:"";

  if(what==="taxes")o.of=cur.ofSet?cur.of:(cur.of=ofGuess(d.name,toG((+d.amt||0),d.cur),d.date));
  const body=what?fields(d,o)+`<span class="note" data-ed-n="last"></span>`+(what==="inflows"?`<span class="note" data-ed-n="client">${clientNote()}</span>`:"")+`<span class="note" data-ed-n="also">${esc(alsoNote())}</span><div class="ed-foot"><span></span><div class="row"><button class="sm ghost" data-ed-x>Отмена</button><button class="sm primary" data-ed-save>Добавить</button></div></div>`
   :`<div class="ed-foot"><span class="note">В плане только то, что вписано: разовые строки и строки «каждый месяц».</span><button class="sm ghost" data-ed-x>Отмена</button></div>`;

 // A one-off row for somebody who already has a row «каждый месяц» in that month adds to it — nothing is taken out
 // of the other — and the card says so before the row is saved.
 const alsoNote=()=>{if(!cur||!cur.what||!M)return "";const d=cur.draft,k=norm(alias(d.name)),ym=String(d.date||"").slice(0,7);if(!k||!ym||d.monthly)return "";
  const o=M.items.find(x=>x.src==="occ"&&x.list===cur.what&&x.key===k&&x.occ.ym===ym&&x.on);return o?`В ${monP(ym)} у ${o.name} уже стоит строка «каждый месяц» ${nat(round2(o.amt*(o.factor||1)),o.cur)} — эта добавится к ней.`:"";};
 // A client the table and the settings do not know yet: the tick put on his first invoice is remembered for him.
 const newClient=()=>{if(!cur||cur.what!=="inflows"||!M)return "";const k=norm(alias(cur.draft.name));return k&&!M.clients.some(c=>(c.last||c.set)&&(c.key===k||k.startsWith(c.key+" ")||c.key.split(" ")[0]===k.split(" ")[0]))?k:"";};
 const clientNote=()=>cur&&cur.draft.vat&&cur.vatSet&&newClient()?"Запомню для клиента: UK, с VAT. Изменить — «Настройки → Налоги».":"";
 function addSave(card){

   if(!r.date)r.mon=mon_||Live.today().slice(0,7);if(list==="inflows")r.vat=!!d.vat;

 // ---- «Вписать остаток» ----
 // Every account at once, each with what the page works it out to be. Only an account a founder touches is saved.
 // Under a touched account come the lines dated on or before the balance's day that no statement has shown yet: any
 // of them may already be inside the figure being typed, and ticking one says so — it is then not counted again.
 function balCard(){
  const T=M.T,rank=a=>a.active&&!a.anchor?0:a.active?1:2,list=M.accounts.filter(a=>a.inPlan||a.active).sort((a,b)=>rank(a)-rank(b));
  const rows=list.map(a=>{const sym=SYM[a.cur]||"",A=a.anchor,old=a.legacy&&a.old;
   const hint=A?`по расчёту ${nat(a.est,a.cur)} · вписан ${dRu(A.asOf)}${A.by?", "+A.by:""}`:old?`в старой Кассе было ${nat(a.old,a.cur)} — подтвердите сумму и дату`:a.active?"остатка нет":"счёт не используется";
   return `<div class="ed-acct" data-ed-acct="${esc(a.key)}"><div class="ed-an"><b>${esc(a.name)}</b><span class="note">${esc(hint)}</span></div>
    <label class="fld"><span>Остаток, ${esc(sym.trim()||a.cur)}</span><input type="number" step="any" inputmode="decimal" data-ed-bamt value="${A?a.est:old?a.old:""}" aria-label="Остаток ${esc(a.name)}"></label>
    <label class="fld"><span>На дату</span><input type="date" data-ed-bdate max="${T}" value="${A||!old?T:""}" aria-label="Дата остатка ${esc(a.name)}"></label>
    <div class="ed-passed" data-ed-passed></div><div class="ed-drift" data-ed-drift></div></div>`;}).join("");
  return `<article class="ed-card" data-ed-card="bal"><div class="ed-h">Остатки на счетах</div>
   <div class="note">Впишите, сколько на счёте по банку, и на какой день это верно: сегодня — значит «на сейчас», день раньше — на конец того дня. Дальше считаю сам: по выпискам и по тому, что отмечено оплаченным.</div>
   ${rows||'<div class="note">Счетов пока нет: они появятся с первой выпиской.</div>'}
   <div class="ed-foot"><span></span><div class="row"><button class="sm ghost" data-ed-x>Закрыть</button><button class="sm primary" data-ed-save>Сохранить</button></div></div></article>`;
 }
 const acctOf=box=>M.accounts.find(a=>a.key===box.dataset.edAcct);
 function drift(box){
  const a=acctOf(box),v=q(box,"[data-ed-bamt]").value,out=q(box,"[data-ed-drift]");if(!a||!a.anchor||v===""||!box.dataset.dirty){out.textContent="";return;}
  let est=a.est;box.querySelectorAll("[data-ed-pass]:checked").forEach(i=>{const it=item(i.dataset.edPass);if(it)est+=it.cash*(a.cur==="GBP"?1:+M.fx[a.cur]||1);});
  const d=Math.abs(+v-est);out.textContent=d>Math.max(1,Math.abs(+v)*.001)?`расходится с расчётом на ${nat(round2(d),a.cur)}`:"";
 }
 function touch(box){
  const a=acctOf(box);if(!a)return;box.dataset.dirty="1";
  const host=q(box,"[data-ed-passed]"),day=q(box,"[data-ed-bdate]").value||M.T,keep={};
  host.querySelectorAll("[data-ed-pass]").forEach(i=>{keep[i.dataset.edPass]=i.checked;});
  const list=Live.passed(M,a.key,day).filter(p=>item(p.id));
  host.innerHTML=list.length?`<div class="lbl">Что из этого уже прошло?</div>${list.map(p=>{const it=item(p.id);return `<label class="ed-chk"><input type="checkbox" data-ed-pass="${esc(p.id)}" data-ed-on="${p.on}"${(p.id in keep?keep[p.id]:p.tick)?" checked":""}><span>${esc(it.name)} · ${dRu(it.date)} · ${sum(it)}</span></label>`;}).join("")}<div class="note">Отмеченное уже внутри остатка: второй раз не посчитаю.</div>`:"";
  drift(box);
 }
 function balSave(card){
  const T=Live.today(),jobs=[];if(Plan.lost())return;
  card.querySelectorAll("[data-ed-acct]").forEach(box=>{const a=acctOf(box),v=q(box,"[data-ed-bamt]").value,d=q(box,"[data-ed-bdate]").value||T;if(!a||!box.dataset.dirty||v===""||!isFinite(+v)||d>T)return;
   jobs.push({a,amt:+v,asOf:d,ticks:[...box.querySelectorAll("[data-ed-pass]:checked")].map(i=>({it:item(i.dataset.edPass),on:i.dataset.edOn}))});});
  if(!jobs.length)return toast("Ничего не изменено: впишите сумму или дату у нужного счёта");
  const say=`Остаток вписан: ${jobs.map(j=>j.a.name).join(", ")}`;cur=null;
  Plan.edit(say,(P,now,by)=>{jobs.forEach(j=>{
   let r=j.a.id!=null&&P.banks.find(x=>String(x.id)===j.a.id);
   if(!r){r={id:uid(),name:`${j.a.bank} — ${j.a.cur}`,amt:0,cur:j.a.cur,bank:j.a.bank,on:true,tag:"",info:false,date:""};P.banks.push(r);}
   r.amt=j.amt;r.asOf=j.asOf;r.at=now;r.by=by;delete r.legacy;
   // A ticked line is marked a moment before the balance: it is inside the figure, and adds nothing to it.
   j.ticks.forEach(t=>{if(t.it)W.mark(P,t.it,t.on,now-1,by);});});})&&toast(say,back);
  // What a typed balance changes is the sentence and the first figure, and both are at the top of «Сегодня».
  if(ui.tab==="today")window.scrollTo(0,0);
 }

 // ---- «Настройки → Прогноз» ----
 // Two things a founder sets: the cushion, and how old the balances may be before «Можно вывести» stops naming a
 // sum. What used to be switched here — averages, the founders' usual draws, VAT by revenue, the cautious line —
 // went with the history the page no longer forecasts from.
 const LOSTSET='<div class="banner" style="margin:0 0 12px"><span><b>План изменился в другом окне.</b> То, что вы меняете здесь, больше не сохраняется. Обновите страницу.</span></div>';
 function settings(){
  const P=Plan.doc();if(!P)return `<p class="note" style="margin:0">${Cash.status()==="bad"?"План кассы не загрузился — обновите страницу.":"План ещё загружается."}</p>`;
  const fr=P.fresh&&typeof P.fresh==="object"?P.fresh:{},on=fr.on!==false,days=Math.min(90,Math.max(1,Math.round(+fr.days||8)));
  return `${Cash.status()==="stale"?LOSTSET:""}<label class="fld" for="ed-cushion" style="max-width:240px"><span>Запас, £</span><input id="ed-cushion" data-ed-set="cushion" type="number" min="0" step="500" value="${esc(P.cushion)}"></label>
   <p class="note" style="margin:8px 0 14px">Если остаток в какой-то день окажется меньше запаса, «Сегодня» скажет «впритык», а «Можно вывести» оставит его нетронутым.</p>
   <div class="ed-fresh"><label class="ed-chk" for="ed-fresh"><input id="ed-fresh" type="checkbox" data-ed-set="fresh"${on?" checked":""}><span>Не называть сумму вывода, если остатки старше</span></label><input data-ed-set="freshDays" type="number" min="1" max="90" step="1" value="${days}" aria-label="Сколько дней остаткам можно быть"${on?"":" disabled"}><span>дней</span></div>
   <p class="note" style="margin:8px 0 0">Со старыми остатками не видно, что взяли после них. Если выключить, «Можно вывести» назовёт сумму всегда и скажет, по остаткам на какой день она посчитана.</p>`;
 }
 // ---- «Настройки → Налоги» ----
 // The rules the studio's taxes are worked out by, and which client's invoices carry VAT. Each control saves as it
 // is changed. It is drawn only while «Настройки» is the tab in view: it needs the model, and the model is not
 // worked out for a tab nobody is looking at.
 function taxes(){

// Drawn to the width it is given, like the page's other charts. `D` is one cell a day — {d, e, in, out}: the

// row somebody wrote or a tax worked out by a rule. On a phone the bars are a week each: sixty do not fit.
// o: start — the balance the line sets out from; cush — the cushion, 0 for none; rel — the figures are a change
// from an unknown balance, not a balance; low — the day to name the lowest point on; attr — the attribute that
// numbers the days' hit areas; pick(d) — what a tap on a day does; second — the key of a second figure of each cell

  const step=niceStep((mx-mn)/(small?4:5));mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
  const y=v=>Tp+(Hh-Tp-B)*(mx-v)/(mx-mn||1),f1=v=>Math.round(v*10)/10;let g="";

  for(let v=mn;v<=mx+1e-6;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${f1(y(v))}" y2="${f1(y(v))}" stroke="var(${Math.abs(v)<1e-6?"--border-strong":"--grid"})" stroke-width="${Math.abs(v)<1e-6?1.5:1}"/><text x="${L-8}" y="${f1(y(v)+4)}" text-anchor="end">${o.rel&&v>0?"+":""}${fmtK(v)}</text>`;
  const bw=Math.max(2,Math.min(small?11:16,slot*wk*.55)),bar=(x,a,b,col)=>{const y0=Math.min(y(a),y(b)),h=Math.abs(y(a)-y(b));if(h<.6)return "";
   return `<rect x="${f1(x-bw/2)}" y="${f1(y0)}" width="${f1(bw)}" height="${f1(Math.max(1,h))}" fill="var(${col})"/>`;};
  bars.forEach(b=>{g+=bar(b.x,0,b.in,"--s1")+bar(b.x,0,-b.out,"--s2");});
  if(cush>0&&cush<=mx)g+=`<line x1="${L}" x2="${W-R}" y1="${f1(y(cush))}" y2="${f1(y(cush))}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  const path=(k,s0)=>{let d=`M${L} ${f1(y(s0))} H${f1(cx(0))}`;D.forEach((x,i)=>{d+=`${i?` H${f1(cx(i))}`:""} V${f1(y(x[k]))}`;});return d+` H${W-R}`;};
  if(o.second)g+=`<path d="${path(o.second,o.start2)}" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>`;

  const lo=D.findIndex(x=>x.d===o.low);

   g+=`<circle cx="${f1(cx(lo))}" cy="${f1(y(v))}" r="4" fill="${ink}" stroke="var(--panel)" stroke-width="2"/><text x="${f1(cx(lo))}" y="${f1(below?y(v)+18:y(v)-10)}" text-anchor="${lo>n-6?"end":lo<4?"start":"middle"}" style="fill:${ink};font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round">${o.rel&&v>0?"+":""}${fmtK(v)}</text>`;}
  const every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor((W-L-R)/62))));

  D.forEach((x,i)=>{g+=`<rect class="hit" ${o.attr}="${i}" x="${f1(L+slot*i)}" y="${Tp}" width="${f1(slot)}" height="${Hh-Tp-B}" fill="transparent"/>`;});
  svg.setAttribute("viewBox",`0 0 ${W} ${Hh}`);svg.innerHTML=g;

    tip.hidden=false;const bx=box.getBoundingClientRect(),rb=r.getBoundingClientRect();let left=rb.left-bx.left+rb.width+6;if(left+200>bx.width)left=rb.left-bx.left-206;tip.style.left=Math.max(0,left)+"px";});
   r.addEventListener("mouseleave",()=>{tip.hidden=true;});
   if(o.pick)r.addEventListener("click",()=>o.pick(x.d));});
  return W;
}

// ---------- «Сегодня» ----------
// The first screen: one sentence that says whether the money lasts, six figures, the balance by day and what needs
// a decision; then, side by side, how much can be taken out and the next seven days row by row, and the studio's
// taxes with the running month as three bars. It works nothing out: every figure is the engine's (Live.compute),
// and each figure's element carries data-live="<key>" and data-v="<the number, two decimals>" so a check can hold
// the screen against the model. Nothing on it is invented: no «≈», no history, no averages. It is drawn only while it is the tab in view, and from scratch each time — its rows
// hold no state of their own; the cards that edit are Ed's.
const Today=(()=>{
 const root=$("#view-today"),LISTS=Live.LISTS;
 const MONP=["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];

 const natv=(v,c)=>fmt(v,v%1?2:0,SYM[c]||"");
 const count=(n,a,b,c)=>`${n} ${plural(n,a,b,c)}`,mon=ym=>MONF[+ym.slice(5)-1].toLowerCase();
 // A tax worked out by a rule is shown in whole pounds. No «≈» stands anywhere on the screen: nothing on it is a guess.
 const tx=v=>fmt(Math.round(v));
 // A sum people act on must not look exact: «Можно вывести» is rounded DOWN to a hundred pounds, and under a
 // hundred reads as nothing — so what is on the screen is never more than the model allows.
 const down=v=>Math.floor((v+1e-6)/100)*100;
 const fillBtn=(M,ym,cls)=>`<button class="${cls||"sm"}" data-td-fill="${ym}">Заполнить ${mon(ym)}</button>`;

 // ---- the sentence ----
 function verdict(){
  // When the newest balance or statement is older than yesterday the sentence says as of which day it speaks.
  const acc=k=>M.accounts.find(a=>a.key===k)||null;
  const v=M.verdict,H=M.H,pre=v.asOf?`По остаткам на ${dRuF(v.asOf)}`:"",cap=(s,join)=>pre?pre+(join||": ")+s[0].toLowerCase()+s.slice(1):s;let s,btn="";
  const helper='<button data-td-helper>Подставить по прошлым месяцам</button>';

   s=`Нет остатка: ${who.join(", ")}. Без ${who.length>1?"них":"него"} итог не посчитать. ${M.empty?"План пока пуст.":`По плану за ${H} дней придёт ${fmt(M.IN)} и уйдёт ${fmt(M.OUT)}.`}`;
   // Only a typed balance is a way out of here: a statement brings rows, and no balance, until the page reads

   btn='<button class="primary" data-ed-bal>Вписать остатки</button>'+(M.empty?fillBtn(M,M.T.slice(0,7)," ")+helper:"");}
  // Nothing is written ahead: the page says what is in the bank and what of it is not the studio's, and that is

  else if(v.id==="vE"){const res=M.taxes.reserve||0,sh=v.short;
   s=cap(`План пуст: на счетах ${fmt(M.now)}${res<0.5?"":res>M.now?`, а под налоги нужно ${fmt(res)}`:`, из них ${fmt(res)} — под налоги`}. Вперёд ничего не вписано, поэтому на сколько хватит денег, сказать не могу.${sh&&sh.name?` ${dRuF(sh.d)} срок налога ${sh.name} — ${fmt(sh.gbp)}: на счетах сейчас меньше.`:""}`," ");
   btn=fillBtn(M,M.T.slice(0,7),"primary")+helper;}
  // The day the money runs out comes first: that is the day to act by. The deepest day may be weeks later, and

  else if(v.id==="v4"){const out=M.plusDay?`В плюс выходим ${dRuF(M.plusDay)}.`:"До конца периода в плюс не выходим.";
   s=cap(M.minusDay&&M.minusDay!==M.LOWDAY?`${dRuF(M.minusDay)} не хватит ${fmt(-M.minus)} — это первый минус. Глубже всего ${dRuF(M.LOWDAY)}: не хватит ${fmt(-M.LOW)}. ${out}`:`${dRuF(M.LOWDAY)} не хватит ${fmt(-M.LOW)}. ${out}`);
   btn=`<button data-td-days="${M.minusDay||M.LOWDAY}" data-td-why>Как закрыть</button>`;}

  else if(v.id==="vi"){s=`Сначала разберите ${count(M.inbox.inN,"поступление","поступления","поступлений")} на ${fmt(M.inbox.inGbp)}: часть ожидаемых денег, возможно, уже пришла.`;btn='<button class="primary" data-tabgo="inbox">Разобрать</button>';}
  // A plan with less than half a usual month of costs written is not one to say «денег хватает» about.
  else if(v.id==="vT"){const t=M.free.thin;
   s=cap(`План на ${dRu(t.from)} – ${dRu(t.to)} не дописан: расходов на команду и прочее вписано ${fmt(t.plan)}, обычный месяц — ${fmt(t.usual)}. Пока так, «денег хватает» сказать не могу. Нижняя точка по вписанному — ${fmt(M.LOW)}, ${dRuF(M.LOWDAY)}.`," ");btn=fillBtn(M,t.month,"primary");}
  else s=cap(`Денег хватает на ${H} дней по тому, что вписано в план. Нижняя точка — ${fmt(M.LOW)}, ${dRuF(M.LOWDAY)}.`);
  const old=M.accounts.find(a=>a.stale||a.handOld);
  const SUB={
   between:()=>`${count(M.between.n,"строка","строки","строк")} на ${fmt(M.between.gbp)} между выписками и вписанным остатком — возможно, ${M.between.n===1?"посчитана":"посчитаны"} дважды.`,
   inbox:()=>`В разборе ${count(M.inbox.n,"операция","операции","операций")} на ${fmt(M.inbox.gbp)} — пока ${M.inbox.n===1?"она не разнесена":"они не разнесены"}, часть плана может считаться дважды.`,
   stale:()=>old?`Остаток ${old.name} — от ${dRu(old.stale?old.through:old.anchor.asOf)}: всё, что было позже, считаю по плану.`:"",
   tax:()=>`В нижней точке ${fmt(v.lowRes)} — деньги под налоги.`};
  const subs=v.subs.map(k=>SUB[k]?SUB[k]():"").filter(Boolean).slice(0,2);

 // ---- «Можно вывести», in words ----
 // One sum for the studio — the same whichever chip is pressed, never by founder — or the plain reason why none is
 // named. `M` is handed in: the sixth figure at the head of «Касса» is this answer too.
 // Returns {state, sum (a sum or a zero is named), v (the sum shown), head, lead, say, why, rows[{label, amt, v}],
 // none, notes[], btn}. lead + say + why read as one paragraph, in that order.
 function freeParts(M){
  const acc=k=>M.accounts.find(a=>a.key===k)||null,F=M.free,cush=fmt(M.cushion),res=M.taxes.reserve||0,bal='<button class="sm" data-ed-bal>Вписать остатки</button>';
  const o={state:"",sum:false,v:0,head:"",lead:"",say:"",why:"",rows:[],none:"",notes:[],btn:""};
  if(M.v0)return Object.assign(o,{state:"v0",say:`Сколько можно вывести, посчитаю, когда будут остатки: ${M.missing.map(k=>acc(k).name).join(", ")}.`,btn:bal});
  if(F.why==="stale")return Object.assign(o,{state:"stale",say:`Остатки от ${dRu(M.nowDate)} — впишите свежие: по старым сумму не назову.`,btn:bal});
  if(F.why==="noout")return Object.assign(o,{state:"noout",say:`Сколько можно вывести, скажу, когда в плане будут расходы: впереди их не вписано — заполните ${mon(F.fill)}.`,why:`На счетах ${fmt(M.now)}${res>0.5?`, из них ${fmt(res)} — под налоги`:""}.`,btn:fillBtn(M,F.fill)});
  if(F.why==="thin"){const t=F.thin;return Object.assign(o,{state:"thin",say:`Сумму пока не назову: в плане на ${dRu(t.from)} – ${dRu(t.to)} расходов на команду и прочее — ${fmt(t.plan)}, а обычный месяц — ${fmt(t.usual)}.`,why:`Допишите ${mon(t.month)}.`,btn:fillBtn(M,t.month)});}
  // What is held back on the tight day, part by part, so that the sum can be worked out from what is on the screen.
  // A receipt nobody has sorted yet may be money the plan still waits for: that much is held back as well.
  const v=down(F.now),T=F.tight,wd=F.wd.gbp>0.5,sum=v>=100,parts=`${fmt(T.res)} — налоги, ${cush} — запас${T.inbox>0.5?`, ${fmt(T.inbox)} — в разборе`:""}`;
  o.sum=true;o.v=sum?v:0;o.state=sum?"sum":"zero";
  if(wd)o.lead=`В плане уже выводы: ${fmt(F.wd.gbp)} (${F.wd.n>1?count(F.wd.n,"строка","строки","строк"):dRu(F.wd.date)}).`;
  if(sum){
   // The sum, and the day that decides it with what is held back on that day — also when withdrawals are already
   // written: «сверх них ещё £34,900» with no arithmetic could not be checked against anything on the screen.
   const head=wd?(F.asOf?`Сверх них по остаткам на ${dRu(F.asOf)} можно вывести ещё ${fmt(v)}`:`Сверх них сегодня можно вывести ещё ${fmt(v)}`)
    :F.asOf?`По остаткам на ${dRu(F.asOf)} можно вывести ${fmt(v)} — минус всё, что взяли после ${dRu(F.asOf)}`:`Сегодня можно вывести ${fmt(v)}`,w=F.wait,no=wd?"без новых выводов":"без вывода";
   // The tight point is today's own bank: money that is counted on today and has not come is not in the sum. What
   // the accounts hold «после сегодняшних платежей» is said so where it differs from «Денег сейчас» above.
   if(w){o.say=head+":";o.why=`на счетах ${M.now-T.e>0.5?"после сегодняшних платежей ":""}${fmt(T.e)}; ${parts}. ${w.n>1?`${count(w.n,"поступление","поступления","поступлений")} на ${fmt(w.gbp)} (${w.name} и другие) ещё не пришли — в сумму не входят.`:`${w.name} ${fmt(w.gbp)} (ждали ${dRu(w.date)}) ещё не пришло — в сумму не входит.`}`;}
   else{o.say=head+".";o.why=`Самый тесный день впереди — ${dRu(T.d)}: ${no} на счетах будет ${fmt(T.e)}; ${parts}, остальное можно вывести.`;}
   o.btn=`<button class="sm" data-ed-add="div" data-ed-name="Вывод" data-ed-amt="${v}" data-ed-date="${M.T}">Вписать вывод</button>`;
  }else if(wd){o.say="Сверх них — £0:";o.why=`${dRu(T.d)} без новых выводов на счетах будет ${fmt(T.e)}; ${parts}.`;}
  else if(T.e<0){o.say="Выводить нельзя:";o.why=M.minusDay?`${dRu(M.minusDay)} на счетах не хватит ${fmt(-M.minus)}.`:`${dRu(T.d)} на счетах не хватит ${fmt(-T.e)}.`;}
  else{o.say="Выводить пока нельзя:";o.why=`${dRu(T.d)} на счетах будет ${fmt(T.e)}; ${parts} — свободного не остаётся.`;}
  // When more becomes possible: each step is worded by its cause — whose payment has to arrive — never as a
  // promise of a date.
  let prev=o.v;
  F.steps.forEach((s,i)=>{const a=down(s.amt);if(a<=prev)return;prev=a;
   o.rows.push({i,label:s.by?`когда придёт ${s.by} (${s.date&&s.date<M.T?"ждали":"ждём"} ${dRu(s.date||s.d)})`:`с ${dRu(s.d)}`,amt:(sum?"":"до ")+fmt(a),v:s.amt});});
  if(!sum&&!o.rows.length)o.none="В ближайшие 60 дней свободных денег не появится.";
  if(T.inbox>0.5)o.notes.push(`В разборе ${count(M.inbox.inN,"поступление","поступления","поступлений")} на ${fmt(M.inbox.inGbp)}: возможно, это деньги, которых план ещё ждёт. Пока не разберёте, ${fmt(T.inbox)} в сумму не входят.`);
  o.notes.push("С запасом на 60 дней вперёд от дня вывода, по тому, что вписано. Это одна сумма на всех и на всё, что берут фаундеры: переводы, траты с карт студии, личные налоги.");
  if(F.thin&&!F.thin.half)o.notes.push(`В плане на ${dRu(F.thin.from)} – ${dRu(F.thin.to)} расходов на команду и прочее — ${fmt(F.thin.plan)}; обычный месяц — ${fmt(F.thin.usual)}. Если вписано не всё, вывести можно меньше.`);
  return o;
 }
 function freeCard(){
  const p=freeParts(M);
  return `<section class="card td-free" aria-label="Можно вывести"><h2>Можно вывести${p.head?`<span class="note">${esc(p.head)}</span>`:""}</h2>
   ${p.lead?`<p class="td-fwhy">${esc(p.lead)}</p>`:""}<p class="td-fsay" data-live="free.say" data-v="${p.state}">${esc(p.say)}</p>${p.why?`<p class="td-fwhy">${esc(p.why)}</p>`:""}
   ${p.rows.length?`<div class="td-steps">${p.sum&&p.v?`<div class="td-row"><span class="td-nm">сегодня</span><span class="td-am">${fmt(p.v)}</span></div>`:""}${p.rows.map(r=>`<div class="td-row"><span class="td-nm">${esc(r.label)}</span><span class="td-am" data-live="free.step.${r.i}" data-v="${num(r.v)}">${r.amt}</span></div>`).join("")}</div>`:""}
   ${p.none?`<p class="td-fwhy">${esc(p.none)}</p>`:""}${p.btn?`<div class="row" style="margin-top:12px">${p.btn}</div>`:""}${p.notes.map(x=>`<p class="note">${esc(x)}</p>`).join("")}</section>`;
 }

 // ---- six figures ----
 // They are the head of «Касса» as well, from the same model: the two tabs cannot disagree about a figure they both
 // print. `cls` is a class for the row itself («Касса» makes it stick under the top bar). The sixth is «Можно
 // вывести»; the month's result lives in the month's own block.
 function kpis(M,cls){
  const acc=k=>M.accounts.find(a=>a.key===k)||null;
  const H=M.H,kp=(label,val,hint,o)=>`<div class="kpi${o&&o.hot?" hot":""}${o&&o.tap?" td-kpi":""}"${o&&o.tap?' data-ed-bal role="button" tabindex="0" title="Вписать остаток"':""}><div class="lbl">${label}</div><div class="val${o&&o.cls?" "+o.cls:""}">${val}</div><div class="hint">${hint}</div></div>`;
  // With nothing written ahead no figure of the forecast is shown — whether the balances are typed (vE) or not
  // yet (v0): «Уйдёт £8,612» and «Нужно на счетах £13,612» on the very first screen were one tax bill and the
  // cushion, read as the cost of two months.
  const known=M.accounts.filter(a=>a.anchor).length,vE=M.verdict.id==="vE"||(M.v0&&M.empty),none=(k,label)=>kp(label,lv(k,"","—"),"план пуст");
  const now=M.v0?kp("Денег сейчас",lv("now","","—"),`не хватает остатка: ${esc(M.missing.map(k=>acc(k).name).join(", "))}`,{tap:1})
   :kp(M.nowIsToday?"Денег сейчас":`Денег на ${dRu(M.nowDate)}`,lv("now",M.now,fmt(M.now)),`выписки и остатки по ${dRu(M.nowDate)} · ${count(known,"счёт","счёта","счетов")}${M.taxes.reserve>0.5?` · под налоги ${lv("reserve",M.taxes.reserve,fmt(M.taxes.reserve))}`:""}${M.marksGbp?` · в т.ч. отмечено вручную ${lv("marks",M.marksGbp,(M.marksGbp>0?"+":"")+fmt(M.marksGbp))}`:""}`,{tap:1});
  const low=vE?none("low",M.v0?"Нужно на счетах сегодня":"Нижняя точка"):M.v0?kp("Нужно на счетах сегодня",lv("low",M.need,fmt(M.need)),`чтобы пройти ${H} дней без минуса${M.cushion?` и с запасом ${fmt(M.cushion)}`:""}`,{hot:1})

 // ---- what needs a decision ----

 function card(c,i){

  if(c.n===9)return op(`Без даты и не в расчёте: ${count(c.count,"строка","строки","строк")} на ${fmt(c.gbp)}`,"",`<button class="sm" data-td-flip="undated" aria-expanded="${st.undated}">${st.undated?"Свернуть":"Поставить даты"}</button>`,
   st.undated?c.items.map(id=>by[id]).filter(Boolean).map(it=>`<div class="td-sub"><div class="td-row" data-ed-open="${esc(it.id)}" data-ed-at="need" data-ed-focus="date" role="button" tabindex="0"><span><span class="td-nm">${esc(it.name||"(без названия)")}</span><span class="td-meta">${esc(it.bank)}</span></span><span class="td-am">${Ed.sum(it)}</span></div>${Ed.under(it.id,"need")}</div>`).join(""):"");
  // A month of a «каждый месяц» payout that nobody paid: paid after all, still owed — «Частично…» then asks how

  if(c.n===10)return op(`${esc(c.name)}: в ${MONP[+c.ym.slice(5)-1]} платежа не было`,`Строка «каждый месяц», ${fmt(c.gbp)}. За ${mon(c.ym)} больше не жду; следующие месяцы стоят в плане.`,(c.hint?act("tx",c.item,`Это оно: ${natv(c.hint.amt,c.hint.cur)} · ${dRu(c.hint.d)}`):"")+act("paid",c.item,"Оплачено")+open(c.item,"Частично…","","part")+act("stop",c.item,"Больше не повторять"),Ed.under(c.item,"need"));
  if(c.n===11)return op(`${esc(c.name)} · ${tx(c.gbp)}`,`Срок был ${dRu(c.due)}; в выписках ${esc(c.account)} по ${dRu(c.cov)} такого платежа нет. Считаю, что ещё уйдёт.${c.more?` И ещё за ${count(c.more,"период","периода","периодов")}.`:""}${c.noPay?" Платежей по этому налогу в выписках ещё не было.":""}`,

  if(c.n===12)return op(`${esc(c.label||"Платёж")} · ${fmt(c.gbp)} · ${dRu(c.d)}`,"За какой период этот платёж?",c.periods.map(p=>ans("pay",p.pname,` data-ed-key="${esc(p.key)}"`)).join("")+ans("nopay","Другой налог"));
  // What the page does meanwhile is said as it is counted: a row read by its name is the period's whole bill, or —
  // when it is well under the bill — a part of it, the rest staying on the line the page worked out.
  if(c.n===13)return op(`${esc(c.name)} · ${fmt(c.gbp)} · ${dRu(c.date)}`,c.by!=="name"?`Это тот же счёт, что ${esc(c.rname)} за ${c.pname}, который страница посчитала сама, — ${tx(c.comp)}? Пока считаю оба.`
    :c.part?`Похоже, это часть ${esc(c.rname)} за ${c.pname}, который страница посчитала сама, — ${tx(c.comp)}. Пока считаю её частью: ${fmt(c.gbp)} из ${tx(c.comp)}, остальное — посчитанной строкой.`
    :`Похоже, это тот же счёт, что ${esc(c.rname)} за ${c.pname}, который страница посчитала сама, — ${tx(c.comp)}. Пока считаю один раз — вашу строку.`,
   ans("of","Да, это он",' data-ed-v="whole"')+ans("of","Это часть",' data-ed-v="part"')+ans("of","Нет, отдельный",' data-ed-v="own"'));
  if(c.n===14){const share=c.cur!=="GBP",acc=share?natv(Math.round(c.accN),c.cur):tx(c.acc);
   return op(`${esc(c.name)} за ${c.pname}: начислено ${acc}, ${c.count?`платежей найдено на ${fmt(c.found)} (${c.count})`:"платежей в выписках не найдено"}`,`Срок был ${dRu(c.due)} — до того, как страница начала считать. Остаток ${tx(c.rest)} ещё платите?`,
    (c.parts?ans("parts","Да, частями как раньше"):"")+ans("lump","Да, одной суммой")+ans("shut","Нет, закрыто"));}
  if(c.n===15)return op(`${esc(c.name)}: начислено ${natv(Math.round(c.accN),c.cur)} за ${c.pname}`,`Считаю ${c.rate}% от поступлений на ${esc(c.acct.replace("|"," "))}. Платите этот налог со счёта студии?`,
   ans("yes",`Да, ${c.rate}%`)+ans("rate","Да, другая ставка")+ans("away","Не со счетов студии"));

 function need(){

 // ---- the days ----
 // A row whose invoice carries VAT is counted with it, and says how much of its sum that is: without the words the
 // same row read 9,750 in the plan and £11,700 here, and nothing said why.
 const rowH=(it,at)=>{const done=it.state==="done",meta=[it.bank,it.cur!=="GBP"&&!done?natv(Math.round(it.amt*(it.factor||1)),it.cur):"",done?"":Ed.vatWords(it),Ed.remark(it)].filter(Boolean).join(" · ");
  return `<div class="td-row${done?" td-done":it.kind!=="typed"?" td-hist":""}" data-ed-open="${esc(it.id)}"${at?` data-ed-at="${at}"`:""} role="button" tabindex="0"><span><span class="td-nm">${esc(it.name||"(без названия)")}</span><span class="td-meta">${esc(meta)}</span></span><span class="td-am"${done?"":` data-live="it.${esc(it.id)}" data-v="${num(it.cash)}"`}>${Ed.sum(it)}</span></div>${Ed.under(it.id,at||"")}`;};
 const sortRows=l=>l.sort((a,b)=>(b.dir-a.dir)||Math.abs(b.cash||b.full)-Math.abs(a.cash||a.full));
 function days(){
  const T=M.T,H=M.H,to=st.all?M.end:dAdd(T,6),blocks=[];
  M.days.forEach(D=>{if(D.d>to)return;const live=D.items.map(id=>by[id]).filter(Boolean),done=(M.doneDays[D.d]||[]).map(id=>by[id]).filter(Boolean);if(!live.length&&!done.length)return;
   const i=D.in,o=D.out;
   // With nothing written ahead a balance by day would be a forecast of a plan that is not there: the day says
   // what leaves, and stops at that.
   const left=M.empty?"":(i||o?" · ":"")+(M.v0?"от сегодняшнего: ":"останется ")+lv(`day.${D.d}.e`,D.e,(M.v0&&D.e>0?"+":"")+fmt(D.e));
   blocks.push(`<div class="td-day"><b>${D.d===T?"сегодня, ":""}${dRuW(D.d)}</b><span class="td-dayf">${[i?lv(`day.${D.d}.in`,i,"+"+fmt(i)):"",o?lv(`day.${D.d}.out`,o,"−"+fmt(o)):""].filter(Boolean).join(" · ")}${left}</span></div>${sortRows(live).map(it=>rowH(it)).join("")}${sortRows(done).map(it=>rowH(it)).join("")}`);});
  // What was closed on a day gone by stays under that day, a month back. It is one line until somebody wants it:
  // a month of paid rows above today would bury today.
  const past=Object.keys(M.doneDays).filter(d=>d<T).sort(),pn=past.reduce((a,d)=>a+M.doneDays[d].length,0);
  const before=pn?`<div class="td-day"><b>${st.past?"Закрыто за месяц":`Закрыто за месяц: ${count(pn,"строка","строки","строк")}`}</b><button class="sm ghost" data-td-flip="past" aria-expanded="${st.past}">${st.past?"Свернуть":"Показать"}</button></div>${st.past?past.map(d=>`<div class="td-day"><b>${dRuW(d)}</b></div>${sortRows(M.doneDays[d].map(id=>by[id]).filter(Boolean)).map(it=>rowH(it)).join("")}`).join(""):""}`:"";
  return `<section class="card" aria-label="Ближайшие дни"><h2>${st.all?`Все ${H} дней`:"Ближайшие 7 дней"}<span class="note">нажмите на строку, чтобы поправить</span></h2>
   <div class="td-days">${before}${blocks.join("")||`<p class="note" style="margin:8px 0 0">${M.empty?"План пуст: в эти дни ничего не вписано.":"В эти дни строк нет."}</p>`}</div>
   <div class="td-foot"><span></span><button class="sm ghost" data-td-flip="all" aria-expanded="${st.all}">${st.all?"Только 7 дней":`Показать все ${H} дней`}</button></div></section>`;
 }

 // ---- the studio's taxes ----
 // Worked out by the rules of «Настройки → Налоги», and kept apart from costs: for each tax and period what has
 // accrued from the facts, what the plan will still add, what has been paid and when it falls due — and, on the
 // right, how much of the money in the bank today is held for it. The sum of that column is «под налоги».
 function taxCard(){
  const X=M.taxes,rules={},T=M.T,recent=dAdd(T,-45);X.rules.forEach(r=>{rules[r.id]=r;});
  const off=r=>r.ask||r.away,closed=p=>["paid","word","none"].includes(p.state);
  // A rule that counts shows the periods still open, the one a founder was asked about, the running one, and what
  // was closed in the last month and a half. A rule that does not count shows what it accrues, and no more.
  const shown=X.periods.filter(p=>{const r=rules[p.rule];if(!r||!r.on)return false;
   if(off(r))return !p.look&&p.start<=T&&p.accF+p.accP>0.5&&p.end>=dAdd(T,-124);
   if(p.asked)return true;if(closed(p))return (p.on||p.date)>=recent&&p.owed+p.paid>0.5;
   return ["run","open","late","parts","typed"].includes(p.state)&&p.accF+p.accP+p.paid+p.left>0.5;});
  const row=p=>{const r=rules[p.rule],share=r.base==="share",cur=share?r.acct.split("|")[1]||"GBP":"GBP",it=p.item?by[p.item]:null,W=p.row?by[p.row]:null,k=`tax.${p.key}`;
   const accF=lv(k+".accF",p.accF,share&&cur!=="GBP"?`${natv(Math.round(p.accN),cur)} (${fmt(p.accF)})`:tx(p.accF));
   const meta=[`начислено ${accF}`];
   if(p.end>=T&&p.accP>0.5)meta.push(`по плану ещё ${lv(k+".accP",p.accP,tx(p.accP))}`);
   if(!off(r))meta.push(`оплачено ${lv(k+".paid",p.paid,fmt(p.paid,p.paid%1?2:0))}`);
   const back=(verb,id)=>` <button class="sm ghost" data-ed-do="${verb}" data-ed-id="${esc(id)}">Вернуть</button>`;
   // One thing a period may say beyond its figures.
   const word=r.away?"платим не со счетов студии — в расчёт не входит":r.ask?"ответьте, платите ли его со счёта студии — пока в расчёт не входит"
    :p.asked?"срок был до начала расчёта — ответьте, платите ли остаток"
    :p.state==="paid"&&p.by==="mark"?`отмечено оплаченным ${dRu(p.on)}${it?back("unpaid",it.id):""}`
    :p.state==="paid"?`оплачено${p.on?" "+dRu(p.on):""}`
    :p.state==="word"?`оплачено по вашему слову, в выписках не видно${it?back("unpaid",it.id):""}`
    :p.state==="none"?`не платим${it?back("on",it.id):""}`
    :p.state==="typed"&&W?`вместо расчёта — строка «${esc(W.name)}»`
    :p.state==="parts"?`частями: ${fmt(p.paid)} из ${p.approx?tx(p.owed):fmt(p.owed)}`
    :p.state==="late"&&it?`срок прошёл ${it.lateDays} дн. назад`
    :!p.approx?`сумма ваша: ${fmt(p.owed)}`:p.state==="run"?"идёт":"";
   const due=closed(p)||off(r)?"":p.date<T?` · срок был ${dRu(p.date)}`:` · до ${dRu(p.date)}`,id=it&&!closed(p)?it.id:W?W.id:"";
   const res=off(r)||closed(p)?"—":lv(k+".res",p.res,tx(p.res));
   return `<div class="td-row"${id?` data-ed-open="${esc(id)}" data-ed-at="tax" role="button" tabindex="0"`:""} data-td-per="${esc(p.key)}" data-td-state="${p.state}"><span><span class="td-nm">${esc(p.name)}${due}</span><span class="td-meta">${meta.join(" · ")}${word?" · "+word:""}</span></span><span class="td-am">${res}</span></div>${id?Ed.under(id,"tax"):""}`;};
  // The next thing to pay, of the taxes worked out and of the tax rows a founder wrote.
  const next=M.items.filter(it=>it.list==="taxes"&&it.open&&it.day).sort((a,b)=>a.day<b.day?-1:1)[0];
  // The tax rows a founder wrote himself stand in the block too — a bill of its own (Corporation tax, which the

 // ---- the running month: three bars ----
 // Income, spending and what is left — each as the month's whole (what has happened plus what the plan still
 // holds), one bar that is solid for what has already happened and an outline for what is ahead, and one line of
 // words. The two bars share a scale, so spending is read against income at a glance. Everything in it is facts
 // and written rows; nothing is averaged.
 function month(){
  const B=M.month.blocks,ym=M.month.ym,name=MONF[+ym.slice(5)-1],m=mon(ym),out=k=>round2(B.team[k]+B.other[k]+B.tax[k]+B.div[k]);
  const inc=B.rev,oT=out("total"),oF=out("fact"),top=Math.max(1,inc.total,oT),w=v=>Math.max(0,Math.min(100,v/top*100)).toFixed(2);

  const part=(k,label)=>`${label} ${lv(`m.${k}.total`,B[k].total,fmtK(B[k].total))}`;
  const tax=(M.months.by[ym]||{}).tax||{gbp:0,rules:[]};

  const fact=M.month.through?`Сплошное — по выпискам до ${dRu(M.month.through)}`:M.month.byWord?"Сплошное — пока только отмеченное вручную":"";
  return `<section class="card td-month" aria-label="${name}: факт и план"><h2>${name}: факт и план<span class="note">сплошное — уже, контур — ещё впереди</span></h2>
   <div class="td-band"><div class="td-bh"><b>Доход за ${m}</b><span class="td-bv">${lv("m.rev.total",inc.total,fmt(inc.total))}</span></div>${bar(inc.fact,inc.total,`Получено ${fmt(inc.fact)} из ${fmt(inc.total)}`)}
    <div class="td-cap">получено ${lv("m.rev.fact",inc.fact,fmt(inc.fact))} из ${fmt(inc.total)}${inc.vat>0.5?` · в т.ч. VAT ${lv("m.rev.vat",inc.vat,fmtK(inc.vat))}`:""}</div></div>
   <div class="td-band"><div class="td-bh"><b>Расход за ${m}</b><span class="td-bv">${lv("m.out.total",oT,fmt(oT))}</span></div>${bar(oF,oT,`Оплачено ${fmt(oF)} из ${fmt(oT)}`)}

   <div class="td-band td-res"><div class="td-bh"><b>Результат</b><span class="td-bv${r<0?" neg":""}">${lv("m.result.total",r,sign(r))}</span></div>
    <div class="td-cap">${M.empty&&Math.abs(B.result.rest)<0.5?"пока только факты":"по плану за месяц"} · обычно ${lv("m.result.usual",B.result.usual,sign(B.result.usual))}</div></div>
   <p class="note">${fact?fact+`${M.month.inInbox?`, в т.ч. в разборе ${fmt(M.month.inInbox)}`:""}${M.month.byWord&&M.month.through?`, отмечено вручную ${fmt(M.month.byWord)}`:""}. `:""}${M.month.before.in||M.month.before.out?`Хвост ${MONGF[+M.month.before.ym.slice(5)-1]}, которого выписки ещё не показали (${[M.month.before.in?"+"+fmt(M.month.before.in):"",M.month.before.out?"−"+fmt(M.month.before.out):""].filter(Boolean).join(" и ")}), в этот месяц не входит. `:""}Выплаты команде часто уходят в первые дни следующего месяца. Налоги здесь — только платежи${M.month.accrued>0.5?`; начисленное за ${m}, ${lv("m.accrued",M.month.accrued,tx(M.month.accrued))}, — в блоке «Налоги»`:""}.</p>
   <div class="td-foot"><span></span><button class="sm ghost" data-tabgo="dashboard">Все месяцы</button></div></section>`;

  M=Plan.model();by={};M.items.forEach(it=>{by[it.id]=it;});Ed.use(M);
  const T=M.T,H=M.H,ref=M.accounts.find(a=>a.key===M.nowAcct),sub=[dRuW(T),M.v0?"остатки вписаны не все":M.nowDate?`выписки и остатки по ${dRu(M.nowDate)}${ref?` (${ref.name})`:""}`:"остатки не вписаны"];

   <div class="row"><span role="group" aria-label="На сколько дней вперёд" class="row">${[30,60].map(h=>`<button class="chip${H===h?" active":""}" data-td-h="${h}" aria-pressed="${H===h}">${h} дней</button>`).join("")}</span><button class="primary" data-ed-add>Добавить</button></div></div>`;
